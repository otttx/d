/* جدول الرصد */
/* خطة الأعمدة: الأعمال ثم الفصلي ثم النهائي، مع مجموع فرعي للمجموعة متعددة الأعمدة */
function columnPlan(course) {
  const groups = courseGroups(course);
  const banded = groups.length > 1;
  const plan = [];
  groups.forEach((g, gi) => {
    g.tasks.forEach((t, i) => plan.push({ kind: 'task', t, g: g.key, sep: banded && gi > 0 && i === 0 }));
    if (banded && g.tasks.length > 1) plan.push({ kind: 'sub', g: g.key, max: g.max, label: g.sub });
  });
  return { groups, banded, plan };
}
function thTaskHtml(t, sep) {
  const off = isWorkOff(t);
  return '<th class="th-task' + (off ? ' is-off' : '') + (sep ? ' sep' : '') + '" scope="col"><button type="button" class="th-btn" data-act="edit-task" data-tid="' + esc(t.id) + '" title="' + esc(t.title + '\nانقر للتعديل') + '">' +
    '<span class="th-title">' + esc(t.title) + '</span>' +
    '<span class="th-meta">' + (taskGroup(t) === 'work' ? '<span class="type-chip tone-' + typeTone(t) + '">' + esc(typeLabel(t)) + '</span>' : '') + '<span class="th-max">من ' + fmt(t.maxGrade) + '</span></span>' +
    (off ? '<span class="th-off">غير محتسب في الإنجاز</span>' : '') + '</button></th>';
}
function subHtml(v, max) { return '<span class="sub-val">' + fmt(v) + '</span><span class="sub-of">من ' + fmt(max) + '</span>'; }

function tableHtml(course) {
  if (!course.students.length) return emptyStateHtml(course);
  const { groups, banded, plan } = columnPlan(course);
  const list = visibleStudents(course);
  const sumMax = tasksTotal(course);
  const countTxt = list.length === course.students.length ? String(course.students.length) : list.length + ' من ' + course.students.length;
  const span = banded ? ' rowspan="2"' : '';
  const nameTh = '<th class="col-name" scope="col"' + span + '><div class="th-name">الطالب <span class="th-count">(' + countTxt + ')</span></div></th>';
  const totalTh = '<th class="col-total" scope="col"' + span + '><div class="th-total">' + (banded ? 'المجموع الكلي' : 'المجموع') + '<span>من ' + fmt(sumMax) + '</span></div></th>';
  let cols = '';
  if (!course.tasks.length) cols = '<th class="th-empty" scope="col"><button type="button" class="btn btn-line btn-sm" data-act="add-task">' + icon('plus') + '<span>أضف أول تكليف أو اختبار لبدء الرصد</span></button></th>';
  plan.forEach(col => {
    cols += col.kind === 'task' ? thTaskHtml(col.t, col.sep)
      : '<th class="th-sub sub-' + col.g + '" scope="col"><div class="th-total">' + col.label + '<span>من ' + fmt(col.max) + '</span></div></th>';
  });
  let h = '<table class="grid' + (banded ? ' is-banded' : '') + '" id="grid"><thead>';
  if (banded) {
    h += '<tr class="band-row">' + nameTh + groups.map((g, gi) =>
      '<th class="band band-' + g.key + (gi > 0 ? ' sep' : '') + '" scope="colgroup" colspan="' + (g.tasks.length + (g.tasks.length > 1 ? 1 : 0)) + '">' +
      '<span class="band-name">' + g.label + '</span><span class="band-max">' + fmt(g.max) + ' درجة</span></th>').join('') + totalTh + '</tr>' +
      '<tr class="cols-row">' + cols + '</tr>';
  } else {
    h += '<tr>' + nameTh + cols + totalTh + '</tr>';
  }
  h += '</thead><tbody>';
  if (!list.length) {
    h += '<tr class="no-results"><td colspan="' + (Math.max(plan.length, 1) + 2) + '">' +
      (ui.search ? 'لا يوجد طالب يطابق «' + esc(ui.search) + '»' : 'لا يوجد طلاب بهذه الحالة') + (ui.filter !== 'all' ? ' ضمن التصفية الحالية' : '') + '.</td></tr>';
  }
  list.forEach(s => { h += rowHtml(course, s, sumMax, plan); });
  h += '</tbody>' + (plan.length ? tfootHtml(course, plan) : '') + '</table>';
  return h;
}

function pillHtml(r) {
  const st = STATUS[r.status];
  const title = r.status === 'none' ? st.long : (st.label + ': أنجز ' + r.done + ' من ' + r.req);
  return '<span class="status-pill st-' + r.status + '" title="' + esc(title) + '">' + icon(st.icon) + '<span>' + (r.req ? r.done + '/' + r.req : '—') + '</span></span>';
}
function noteBtnHtml(s) {
  const n = s.notes.length;
  const last = n ? s.notes[n - 1] : null;
  return '<button type="button" class="ra ra-note' + (n ? ' has-notes' : '') + '" data-act="notes" title="' +
    esc(n ? 'الملاحظات (' + n + ')\nآخرها: ' + truncate(last.text, 90) : 'إضافة ملاحظة') + '" aria-label="' + (n ? 'ملاحظات الطالب (' + n + ')' : 'إضافة ملاحظة') + '">' +
    icon(n ? 'note-filled' : 'note') + (n ? '<span class="badge">' + n + '</span>' : '') + '</button>';
}
function totalHtml(r, sumMax) {
  const pct = sumMax ? Math.max(0, Math.min(100, r.total / sumMax * 100)) : 0;
  return '<div class="total"><span class="total-val">' + fmt(r.total) + '</span><span class="total-of">من ' + fmt(sumMax) + '</span></div>' +
    '<div class="total-bar"><i style="width:' + pct.toFixed(1) + '%"></i></div>';
}
function rowHtml(course, s, sumMax, plan) {
  const r = studentResult(course, s);
  const idx = course.students.indexOf(s) + 1;
  let h = '<tr data-sid="' + esc(s.id) + '" class="row-' + r.status + '">' +
    '<th class="col-name" scope="row"><div class="name-cell"><span class="row-no">' + idx + '</span>' +
      '<div class="name-main"><span class="student-name">' + esc(s.name) + '</span>' + pillHtml(r) + '</div>' +
      '<div class="row-actions">' + noteBtnHtml(s) +
        '<button type="button" class="ra" data-act="edit-student" title="تعديل الاسم" aria-label="تعديل اسم الطالب">' + icon('pencil') + '</button>' +
        '<button type="button" class="ra danger" data-act="delete-student" title="حذف الطالب" aria-label="حذف الطالب">' + icon('trash') + '</button>' +
      '</div></div></th>';
  if (!plan.length) h += '<td class="g-empty">—</td>';
  plan.forEach(col => {
    if (col.kind === 'sub') {
      h += '<td class="sub-cell sub-' + col.g + '" data-g="' + col.g + '" data-max="' + col.max + '">' + subHtml(r.groups[col.g], col.max) + '</td>';
      return;
    }
    const t = col.t, g = s.grades[t.id], has = typeof g === 'number';
    h += '<td class="g-cell' + (isWorkOff(t) ? ' is-off' : '') + (col.sep ? ' sep' : '') + (col.g !== 'work' ? ' is-exam' : '') + '">' +
      '<input class="g-input' + (has ? ' filled' : '') + '" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" maxlength="7" data-tid="' + esc(t.id) + '" value="' + (has ? fmt(g) : '') + '" placeholder="—" aria-label="' + esc('درجة ' + s.name + ' في ' + t.title + ' من ' + fmt(t.maxGrade)) + '"></td>';
  });
  h += '<td class="col-total">' + totalHtml(r, sumMax) + '</td></tr>';
  return h;
}

function tfootHtml(course, plan) {
  const cs = courseStats(course);
  let h = '<tfoot><tr><th class="col-name" scope="row"><div class="foot-label">ملخص الدرجات<span>المتوسط، وعدد من رُصدت درجاتهم</span></div></th>';
  plan.forEach(col => {
    if (col.kind === 'sub') { h += '<td class="foot-cell sub-cell"><b>' + fmt(cs.avgGroups[col.g]) + '</b>المتوسط</td>'; return; }
    const ts = taskStats(course, col.t);
    h += '<td class="foot-cell' + (col.sep ? ' sep' : '') + '"><b>' + (ts.avg === null ? '—' : fmt(ts.avg)) + '</b>' + ts.count + ' من ' + course.students.length + '</td>';
  });
  h += '<td class="col-total foot-cell"><b>' + fmt(cs.avgTotal) + '</b>متوسط المجموع</td></tr></tfoot>';
  return h;
}

/* حالة الحفظ والنسخ الاحتياطي في الشريط العلوي */
function updateSaveStatus() {
  const el = $('#saveStatus');
  if (!el) return;
  let l1;
  if (!storageOk) l1 = '<span class="ss-dot bad"></span><span class="ss-bad">الحفظ التلقائي غير متاح هنا</span>';
  else if (saveError) l1 = '<span class="ss-dot bad"></span><span class="ss-bad">' + esc(saveError) + '</span>';
  else if (lastSavedAt) l1 = '<span class="ss-dot"></span><span>حُفظ تلقائياً ' + fmtTime(lastSavedAt) + '</span>';
  else l1 = '<span class="ss-dot"></span><span>الحفظ التلقائي يعمل</span>';
  const hasData = state.courses.length > 0;
  let l2;
  if (prefs.lastBackupAt) {
    const old = daysBetween(new Date(prefs.lastBackupAt), new Date()) >= 7 && hasData;
    l2 = '<span class="' + (old ? 'ss-warn' : '') + '">آخر نسخة احتياطية: ' + relDay(prefs.lastBackupAt) + '</span>';
  } else {
    l2 = hasData ? '<span class="ss-warn">لم تُصدَّر نسخة احتياطية بعد</span>' : '<span>لا توجد نسخ احتياطية بعد</span>';
  }
  el.innerHTML = '<div class="ss-line">' + l1 + '</div><div class="ss-line ss-sub">' + l2 + '</div>';
  const banner = $('#storageBanner');
  if (banner) banner.hidden = storageOk && !saveError;
}

/* السمة */
function currentTheme() {
  return prefs.theme || ((window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light');
}
function applyTheme() {
  const t = currentTheme();
  document.documentElement.setAttribute('data-theme', t);
  const b = $('#btnTheme');
  if (b) {
    b.innerHTML = icon(t === 'dark' ? 'sun' : 'moon');
    b.title = t === 'dark' ? 'الوضع النهاري' : 'الوضع الليلي';
    b.setAttribute('aria-label', b.title);
  }
}
function toggleTheme() {
  prefs.theme = currentTheme() === 'dark' ? 'light' : 'dark';
  savePrefs();
  applyTheme();
}

/* ============================================================
   الأحداث ورصد الدرجات
   ============================================================ */
function bindEvents() {
  $('#btnAddCourse').addEventListener('click', () => openCourseModal(null));
  $('#btnExport').addEventListener('click', () => exportBackup(false));
  $('#btnImport').addEventListener('click', () => $('#fileBackup').click());
  $('#btnDanger').addEventListener('click', () => openDangerModal());
  $('#btnTheme').addEventListener('click', toggleTheme);
  $('#btnAbout').addEventListener('click', () => openWelcome(false));
  $('#bannerExport').addEventListener('click', () => exportBackup(false));

  $('#fileBackup').addEventListener('change', e => {
    const f = e.target.files && e.target.files[0];
    e.target.value = '';
    if (f) handleBackupFile(f);
  });
  $('#fileNames').addEventListener('change', e => {
    const f = e.target.files && e.target.files[0];
    e.target.value = '';
    if (f) handleNamesFile(f);
  });

  const tabs = $('#tabs');
  tabs.addEventListener('click', e => { const t = e.target.closest('.tab'); if (t) switchCourse(t.getAttribute('data-course')); });
  tabs.addEventListener('dblclick', e => {
    const t = e.target.closest('.tab');
    const c = t && courseById(t.getAttribute('data-course'));
    if (c) openCourseModal(c);
  });
  tabs.addEventListener('keydown', onTabsKeydown);

  const main = $('#main');
  main.addEventListener('click', onMainClick);
  main.addEventListener('input', onMainInput);
  main.addEventListener('keydown', onMainKeydown);
  main.addEventListener('focusin', e => {
    const t = e.target;
    if (t.classList && t.classList.contains('g-input')) {
      /* حفظ الدرجة الأصلية لإعادتها إن انتهى الإدخال بقيمة غير صالحة */
      const ctx = gradeContext(t);
      t._origSet = !!ctx;
      t._orig = ctx && typeof ctx.student.grades[ctx.task.id] === 'number' ? ctx.student.grades[ctx.task.id] : null;
      t._focusAt = Date.now();
      t.select();
    }
  });
  main.addEventListener('focusout', e => {
    const t = e.target;
    if (t.classList && t.classList.contains('g-input')) commitGrade(t);
  });
  /* إبقاء النص محدداً بعد النقر بالفأرة لتسهيل الكتابة فوق الدرجة */
  main.addEventListener('mouseup', e => {
    const t = e.target;
    if (t.classList && t.classList.contains('g-input') && t._focusAt && Date.now() - t._focusAt < 400) { e.preventDefault(); t._focusAt = 0; }
  });

  document.addEventListener('keydown', onDocKeydown);
  window.addEventListener('storage', onStorage);
  window.addEventListener('beforeprint', () => buildPrintArea(currentCourse()));
  if (window.matchMedia) {
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    const h = () => { if (!prefs.theme) applyTheme(); };
    if (mq.addEventListener) mq.addEventListener('change', h); else if (mq.addListener) mq.addListener(h);
  }
}

function switchCourse(id) {
  if (!id || id === state.activeCourseId || !courseById(id)) return;
  state.activeCourseId = id;
  ui.search = '';
  ui.filter = 'all';
  saveState({ silent: true });
  renderTabs();
  renderMain();
}

function onTabsKeydown(e) {
  if (['ArrowLeft', 'ArrowRight', 'Home', 'End'].indexOf(e.key) < 0) return;
  const ids = state.courses.map(c => c.id);
  if (!ids.length) return;
  let i = Math.max(0, ids.indexOf(state.activeCourseId));
  if (e.key === 'ArrowLeft') i = Math.min(ids.length - 1, i + 1);
  else if (e.key === 'ArrowRight') i = Math.max(0, i - 1);
  else if (e.key === 'Home') i = 0;
  else i = ids.length - 1;
  e.preventDefault();
  switchCourse(ids[i]);
  const el = document.getElementById('tab-' + ids[i]);
  if (el) el.focus();
}

function onMainClick(e) {
  const el = e.target.closest('[data-act],[data-filter]');
  if (!el || !$('#main').contains(el)) return;
  const course = currentCourse();
  if (el.hasAttribute('data-filter')) {
    const f = el.getAttribute('data-filter');
    ui.filter = ui.filter === f ? 'all' : f;
    refreshSummary();
    refreshTable({ resetScroll: true });
    return;
  }
  const tr = el.closest('tr[data-sid]');
  const sid = tr ? tr.getAttribute('data-sid') : null;
  switch (el.getAttribute('data-act')) {
    case 'add-course': openCourseModal(null); break;
    case 'import-backup': $('#fileBackup').click(); break;
    case 'edit-course': if (course) openCourseModal(course); break;
    case 'tasks': openTasksModal(null, false); break;
    case 'add-task': openTasksModal(null, true); break;
    case 'edit-task': openTasksModal(el.getAttribute('data-tid'), false); break;
    case 'print': printCourse(); break;
    case 'add-student': openStudentModal(null); break;
    case 'import-names': pickNamesFile(); break;
    case 'sort': sortStudents(); break;
    case 'clear-search': {
      ui.search = '';
      const si = $('#searchInput');
      if (si) { si.value = ''; si.focus(); }
      toggleSearchClear();
      refreshTable({ resetScroll: true });
      break;
    }
    case 'clear-filter': ui.filter = 'all'; refreshSummary(); refreshTable(); break;
    case 'notes': if (sid) openNotesModal(sid); break;
    case 'edit-student': if (sid) openStudentModal(sid); break;
    case 'delete-student': if (sid) deleteStudent(sid); break;
    default: break;
  }
}
function toggleSearchClear() { const b = $('.search-clear'); if (b) b.hidden = !ui.search; }

function onMainInput(e) {
  const t = e.target;
  if (t.id === 'searchInput') {
    ui.search = t.value;
    toggleSearchClear();
    refreshTable({ resetScroll: true });
    return;
  }
  if (t.classList && t.classList.contains('g-input')) onGradeInput(t);
}

function onMainKeydown(e) {
  const t = e.target;
  if (t.id === 'searchInput' && e.key === 'Escape' && t.value) {
    e.preventDefault();
    t.value = '';
    ui.search = '';
    toggleSearchClear();
    refreshTable({ resetScroll: true });
    return;
  }
  if (!t.classList || !t.classList.contains('g-input')) return;
  if (e.key === 'Enter' || e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    moveVertical(t, (e.key === 'ArrowUp' || (e.key === 'Enter' && e.shiftKey)) ? -1 : 1);
  } else if (e.key === 'Escape') {
    const ctx = gradeContext(t);
    if (!ctx) return;
    restoreOriginalGrade(t, ctx);
    t.blur();
  }
}

function moveVertical(input, dir) {
  const td = input.closest('td');
  const tr = td && td.parentElement;
  if (!tr) return;
  const col = Array.prototype.indexOf.call(tr.children, td);
  let row = dir > 0 ? tr.nextElementSibling : tr.previousElementSibling;
  while (row) {
    const cell = row.children[col];
    const inp = cell && cell.querySelector('.g-input');
    if (inp) { inp.focus(); return; }
    row = dir > 0 ? row.nextElementSibling : row.previousElementSibling;
  }
}

function onDocKeydown(e) {
  if (modalStack.length) {
    const top = modalStack[modalStack.length - 1];
    if (e.key === 'Escape') { e.preventDefault(); top.close(); return; }
    if (e.key === 'Tab') trapFocus(e, top.el);
    return;
  }
  const t = e.target;
  const typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable);
  if (e.key === '/' && !typing && !e.ctrlKey && !e.metaKey && !e.altKey) {
    const s = $('#searchInput');
    if (s) { e.preventDefault(); s.focus(); s.select(); }
  }
}

function onStorage(e) {
  if (e.key === STORAGE_KEY) {
    let next = emptyState();
    if (e.newValue) {
      try { const r = sanitizeData(JSON.parse(e.newValue)); if (!r.ok) return; next = r.data; }
      catch (err) { return; }
    }
    closeAllModals();
    clearUndo();
    state = next;
    renderAll();
    toast('حُدِّثت البيانات من نافذة أخرى مفتوح فيها البرنامج.', { type: 'info' });
  } else if (e.key === PREFS_KEY) {
    prefs = loadPrefs();
    applyTheme();
    updateSaveStatus();
  }
}

/* ---------- رصد الدرجات ---------- */
function gradeContext(input) {
  const course = currentCourse();
  if (!course) return null;
  const tr = input.closest('tr[data-sid]');
  if (!tr) return null;
  const student = findStudent(course, tr.getAttribute('data-sid'));
  const task = course.tasks.find(t => t.id === input.getAttribute('data-tid'));
  if (!student || !task) return null;
  return { course, tr, student, task, cell: input.parentElement };
}

function onGradeInput(input) {
  const ctx = gradeContext(input);
  if (!ctx) return;
  const { course, tr, student, task, cell } = ctx;
  const r = parseNum(input.value);
  if (r.empty) {
    setCellError(cell, '');
    input.classList.remove('filled');
    if (typeof student.grades[task.id] === 'number') {
      delete student.grades[task.id];
      saveState();
      afterGradeChange(course, student, tr);
    }
    return;
  }
  if (r.error) { setCellError(cell, 'أدخل رقماً فقط'); return; }
  if (r.value > task.maxGrade) { setCellError(cell, 'الحد الأعلى ' + fmt(task.maxGrade)); return; }
  setCellError(cell, '');
  input.classList.add('filled');
  if (student.grades[task.id] !== r.value) {
    student.grades[task.id] = r.value;
    saveState();
    afterGradeChange(course, student, tr);
  }
}

function setCellError(cell, msg) {
  const input = cell.querySelector('.g-input');
  let tip = cell.querySelector('.g-err');
  if (msg) {
    input.classList.add('is-invalid');
    input.setAttribute('aria-invalid', 'true');
    if (!tip) { tip = document.createElement('span'); tip.className = 'g-err'; tip.setAttribute('role', 'alert'); cell.appendChild(tip); }
    tip.textContent = msg;
  } else {
    input.classList.remove('is-invalid');
    input.removeAttribute('aria-invalid');
    if (tip) tip.remove();
  }
}

/* إعادة الدرجة التي كانت في الخانة قبل بدء الكتابة فيها */
function restoreOriginalGrade(input, ctx) {
  const { course, tr, student, task, cell } = ctx;
  const orig = input._origSet ? input._orig : (typeof student.grades[task.id] === 'number' ? student.grades[task.id] : null);
  const cur = typeof student.grades[task.id] === 'number' ? student.grades[task.id] : null;
  if (orig !== cur) {
    if (orig === null) delete student.grades[task.id];
    else student.grades[task.id] = orig;
    saveState();
    afterGradeChange(course, student, tr);
  }
  input.value = orig === null ? '' : fmt(orig);
  input.classList.toggle('filled', orig !== null);
  setCellError(cell, '');
  return orig;
}

/* عند مغادرة الخانة: إعادة الدرجة الأصلية إن كانت المدخلة غير صالحة */
function commitGrade(input) {
  const ctx = gradeContext(input);
  if (!ctx) return;
  const { student, task } = ctx;
  if (input.classList.contains('is-invalid')) {
    const raw = input.value.trim();
    const r = parseNum(raw);
    const orig = restoreOriginalGrade(input, ctx);
    const back = orig === null ? 'وبقيت الخانة فارغة.' : 'وأُعيدت الدرجة السابقة (' + fmt(orig) + ').';
    toast(r.error
      ? '«' + raw + '» ليست درجة صحيحة، ' + back
      : 'الدرجة ' + fmt(r.value) + ' أعلى من الدرجة العظمى لتكليف «' + task.title + '» (' + fmt(task.maxGrade) + ')، ' + back,
      { type: 'error', duration: 6500 });
  } else {
    const stored = student.grades[task.id];
    const shown = typeof stored === 'number' ? fmt(stored) : '';
    if (input.value !== shown) input.value = shown;
  }
  input._origSet = false;
}

function afterGradeChange(course, student, tr) {
  const r = studentResult(course, student);
  const sumMax = tasksTotal(course);
  tr.className = 'row-' + r.status;
  const pill = tr.querySelector('.status-pill');
  if (pill) pill.outerHTML = pillHtml(r);
  const tot = tr.querySelector('td.col-total');
  if (tot) tot.innerHTML = totalHtml(r, sumMax);
  tr.querySelectorAll('td.sub-cell[data-g]').forEach(td => { td.innerHTML = subHtml(r.groups[td.getAttribute('data-g')], +td.getAttribute('data-max')); });
  refreshSummary();

}

function flashRow(sid) {
  const tr = document.querySelector('#grid tr[data-sid="' + cssEsc(sid) + '"]');

  tr.classList.add('flash');

  if (r.bottom > wr.bottom - 60 || r.top < wr.top + 80) wrap.scrollTop += (r.top - wr.top) - wr.height / 2;
  setTimeout(() => tr.classList.remove('flash'), 1900);

/* ---------- الطلاب: ترتيب وحذف ---------- */
function sortStudents() {
  const course = currentCourse();
  if (!course) return;
  if (course.students.length < 2) { toast('لا يوجد ما يكفي من الطلاب للترتيب.', { type: 'info' }); return; }
  const coll = new Intl.Collator('ar', { sensitivity: 'base', numeric: true });
  const asc = course.students.slice().sort((a, b) => coll.compare(normAr(a.name), normAr(b.name)) || coll.compare(a.name, b.name));
  const isAsc = asc.every((s, i) => s === course.students[i]);
  commitWithUndo(() => {
    course.students = isAsc ? asc.reverse() : asc;
    return isAsc ? 'رُتّبت الأسماء تنازلياً (من الياء إلى الألف).' : 'رُتّبت الأسماء أبجدياً (من الألف إلى الياء).';
  }, () => { refreshTable(); });
}

async function deleteStudent(sid) {
  const course = currentCourse();
  const s = findStudent(course, sid);
  if (!s) return;
  const g = Object.keys(s.grades).length, n = s.notes.length;
  const ok = await confirmDialog({
    title: 'حذف الطالب',
    message: 'هل تريد حذف الطالب «' + s.name + '» من مادة «' + course.name + '»؟' +
      ((g || n) ? ' ستُحذف معه درجاته المرصودة (' + g + ') وملاحظاته (' + n + ').' : ''),
    confirmText: 'حذف الطالب',
    danger: true
  });
  if (!ok) return;
  const courseId = course.id;
  commitWithUndo(() => {
    const c = courseById(courseId);
    if (c) c.students = c.students.filter(x => x.id !== sid);
    return 'حُذف الطالب «' + s.name + '».';
  });
}

/* ============================================================
   النوافذ المنبثقة والإشعارات والتراجع
   ============================================================ */
const modalStack = [];

function openModal(o) {
  const id = 'm' + uid();
  const prevFocus = document.activeElement;
  const back = document.createElement('div');
  back.className = 'modal-back';
  back.style.zIndex = String(100 + modalStack.length * 2);
  back.innerHTML = '<div class="modal modal-' + (o.size || 'sm') + (o.tone === 'danger' ? ' modal-danger' : '') + '" role="dialog" aria-modal="true" aria-labelledby="' + id + '-t">' +
    '<div class="modal-head">' + (o.icon ? '<span class="modal-ico">' + icon(o.icon) + '</span>' : '') +
      '<h2 id="' + id + '-t">' + esc(o.title) + '</h2>' +
      '<button type="button" class="icon-btn icon-btn-sm" data-close aria-label="إغلاق">' + icon('x') + '</button></div>' +
    '<div class="modal-body">' + (o.body || '') + '</div>' +
    (o.footer ? '<div class="modal-foot">' + o.footer + '</div>' : '') + '</div>';
  document.body.appendChild(back);
  const handle = {
    el: back,
    body: back.querySelector('.modal-body'),
    foot: back.querySelector('.modal-foot'),
    closed: false,
    close() {
      if (handle.closed) return;
      handle.closed = true;
      const i = modalStack.indexOf(handle);
      if (i >= 0) modalStack.splice(i, 1);
      back.classList.remove('open');
      setTimeout(() => back.remove(), 170);
      document.body.classList.toggle('has-modal', modalStack.length > 0);
      if (o.onClose) o.onClose();
      if (prevFocus && document.contains(prevFocus) && typeof prevFocus.focus === 'function') {
        try { prevFocus.focus({ preventScroll: true }); } catch (e) { /* تجاهل */ }
      }
    }
  };
  back.addEventListener('click', e => { if (e.target.closest('[data-close]')) handle.close(); });
  modalStack.push(handle);
  document.body.classList.add('has-modal');
  requestAnimationFrame(() => back.classList.add('open'));
  setTimeout(() => {
    if (handle.closed || back.contains(document.activeElement)) return;
    const f = (o.focus && back.querySelector(o.focus)) ||
      back.querySelector('.modal-body input[type="text"], .modal-body textarea, .modal-body select') ||
      back.querySelector('.modal-foot .btn');
    if (f) f.focus();
  }, 40);
  return handle;
}
function isTypingIn(root) {
  const a = document.activeElement;
  return !!a && root.contains(a) && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.tagName === 'SELECT');
}
function closeAllModals() { while (modalStack.length) modalStack[modalStack.length - 1].close(); }

function trapFocus(e, root) {
  const f = Array.prototype.slice.call(root.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]):not([type="hidden"]),select:not([disabled]),textarea:not([disabled]),summary,[tabindex]:not([tabindex="-1"])'))
    .filter(x => x.offsetParent !== null);
  if (!f.length) return;
  const first = f[0], last = f[f.length - 1];
  if (!root.contains(document.activeElement)) { e.preventDefault(); first.focus(); }
  else if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
}

function confirmDialog(o) {
  return new Promise(resolve => {
    let done = false;
    const finish = v => { if (!done) { done = true; resolve(v); } };
    const m = openModal({
      title: o.title, size: 'sm', icon: o.danger ? 'alert' : 'info', tone: o.danger ? 'danger' : '',
      body: '<p class="dialog-text">' + esc(o.message) + '</p>',
      footer: '<button type="button" class="btn ' + (o.danger ? 'btn-danger' : 'btn-primary') + '" data-ok>' + esc(o.confirmText || 'تأكيد') + '</button>' +
              '<button type="button" class="btn btn-ghost" data-close>' + esc(o.cancelText || 'إلغاء') + '</button>',
      focus: o.danger ? '.modal-foot [data-close]' : '.modal-foot [data-ok]',
      onClose: () => finish(false)
    });
    m.foot.querySelector('[data-ok]').addEventListener('click', () => { finish(true); m.close(); });
  });
}
function alertDialog(o) {
  return openModal({
    title: o.title, size: 'sm', icon: o.danger ? 'alert' : 'info', tone: o.danger ? 'danger' : '',
    body: '<p class="dialog-text">' + esc(o.message) + '</p>',
    footer: '<button type="button" class="btn btn-primary" data-close>حسناً</button>'
  });
}
function showErr(box, msg, focusEl) {
  box.textContent = msg;
  box.hidden = false;
  if (focusEl) focusEl.focus();
  return false;
}

/* الإشعارات */
function toast(message, o) {
  o = o || {};
  const type = o.type || 'info';
  const wrap = $('#toasts');
  const el = document.createElement('div');
  el.className = 'toast toast-' + type;
  el.setAttribute('role', type === 'error' ? 'alert' : 'status');
  const ic = { success: 'check-circle', error: 'x-circle', warn: 'alert', info: 'info' }[type] || 'info';
  el.innerHTML = icon(ic) + '<div class="toast-msg">' + esc(message) + '</div>' +
    (o.action ? '<button type="button" class="toast-action">' + icon('undo') + esc(o.action.label) + '</button>' : '') +
    '<button type="button" class="toast-x" aria-label="إغلاق الإشعار">' + icon('x') + '</button>';
  wrap.appendChild(el);
  let timer = null, gone = false;
  const dismiss = () => {
    if (gone) return;
    gone = true;
    clearTimeout(timer);
    el.classList.add('out');
    setTimeout(() => el.remove(), 200);
    if (o.onDismiss) o.onDismiss();
  };
  el._dismiss = dismiss;
  if (o.action) el.querySelector('.toast-action').addEventListener('click', () => { o.action.onClick(); dismiss(); });
  el.querySelector('.toast-x').addEventListener('click', dismiss);
  const start = () => { clearTimeout(timer); timer = setTimeout(dismiss, o.duration || 3800); };
  el.addEventListener('mouseenter', () => clearTimeout(timer));
  el.addEventListener('mouseleave', start);
  start();
  const live = Array.prototype.filter.call(wrap.children, x => !x.classList.contains('out'));
  if (live.length > 3 && live[0]._dismiss) live[0]._dismiss();
  return { dismiss, el };
}

/* تنفيذ عملية مع إمكانية التراجع عنها */
function commitWithUndo(mutate, rerender) {
  const snap = JSON.stringify(state);
  const msg = mutate();
  saveState();
  (rerender || renderAll)();
  let t = null;
  t = toast(msg || 'تم.', {
    type: 'success', duration: 9000,
    action: { label: 'تراجع', onClick: doUndo },
    onDismiss: () => { if (undo && undo.toast === t) undo = null; }
  });
  undo = { snap, rev: revision, toast: t };
}
function doUndo() {
  if (!undo || undo.rev !== revision) { toast('لا يمكن التراجع بعد إجراء تعديلات أخرى.', { type: 'warn' }); return; }
  let res;
  try { res = sanitizeData(JSON.parse(undo.snap)); } catch (e) { res = { ok: false }; }
  const t = undo.toast;
  undo = null;
  if (t) t.dismiss();
  if (!res.ok) return;
  closeAllModals();
  state = res.data;
  ui.search = '';
  ui.filter = 'all';
  saveState();
  renderAll();
  toast('تم التراجع، وأُعيدت البيانات كما كانت.', { type: 'info' });
}
function clearUndo() {
  const u = undo;
  undo = null;
  if (u && u.toast) u.toast.dismiss();
}

      s.notes.slice().reverse().map(n => {
        const ed = n.id === editingNote;
        return '<li class="note-item" data-nid="' + esc(n.id) + '"><div class="note-head"><span class="note-date">' + icon('clock') + esc(fmtDateTime(n.createdAt)) +
          (n.updatedAt ? ' <em>(عُدّلت ' + esc(fmtDateTime(n.updatedAt)) + ')</em>' : '') + '</span>' +
          (ed ? '' : '<span class="note-actions"><button type="button" class="ra" data-n="edit" title="تعديل الملاحظة" aria-label="تعديل الملاحظة">' + icon('pencil') + '</button>' +
            '<button type="button" class="ra danger" data-n="del" title="حذف الملاحظة" aria-label="حذف الملاحظة">' + icon('trash') + '</button></span>') + '</div>' +
          (ed ? '<textarea class="note-edit" rows="3" aria-label="تعديل الملاحظة">' + esc(n.text) + '</textarea>' +
                '<div class="note-edit-actions"><button type="button" class="btn btn-primary btn-sm" data-n="save">حفظ التعديل</button><button type="button" class="btn btn-ghost btn-sm" data-n="cancel">إلغاء</button></div>'
              : '<div class="note-text">' + esc(n.text) + '</div>') + '</li>';
      }).join('') + '</ul>';
    if (editingNote) {
      const t = list.querySelector('.note-edit');
      if (t) { t.focus(); t.setSelectionRange(t.value.length, t.value.length); }
    }
  };
  const add = () => {
    const s = getS();
    if (!s) return;
    const text = ta.value.replace(/\r\n?/g, '\n').trim();
    if (!text) { ta.focus(); return; }
    s.notes.push({ id: uid(), text: text.slice(0, 5000), createdAt: nowIso(), updatedAt: null });
    saveState();
    ta.value = '';
    render();
    refreshTable();
    ta.focus();
  };
  m.el.querySelector('[data-n="add"]').addEventListener('click', add);
  ta.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); add(); } });
  list.addEventListener('keydown', e => {
    if (e.target.classList.contains('note-edit') && e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      const b = list.querySelector('[data-n="save"]');
      if (b) b.click();
    }
  });
  list.addEventListener('click', async e => {
    const b = e.target.closest('[data-n]');
    const li = b && b.closest('[data-nid]');
    if (!li) return;
    const nid = li.getAttribute('data-nid');
    const s = getS();
    const note = s && s.notes.find(n => n.id === nid);
    if (!note) return;
    const act = b.getAttribute('data-n');
    if (act === 'edit') { editingNote = nid; render(); }
    else if (act === 'cancel') { editingNote = null; render(); }
    else if (act === 'save') {
      const val = li.querySelector('.note-edit').value.replace(/\r\n?/g, '\n').trim();
      if (!val) { toast('لا يمكن حفظ ملاحظة فارغة؛ احذفها إن لم تعد تحتاجها.', { type: 'warn' }); return; }
      if (val !== note.text) { note.text = val.slice(0, 5000); note.updatedAt = nowIso(); saveState(); refreshTable(); }
      editingNote = null;
      render();
    } else if (act === 'del') {
      const ok = await confirmDialog({ title: 'حذف الملاحظة', message: 'هل تريد حذف هذه الملاحظة؟', confirmText: 'حذف الملاحظة', danger: true });
      if (!ok) return;
      commitWithUndo(() => {
        const ss = getS();
        if (ss) ss.notes = ss.notes.filter(n => n.id !== nid);
        return 'حُذفت الملاحظة.';
      }, () => { render(); refreshTable(); });
    }
  });
  render();
}

/* ============================================================

            '<label class="check" data-f="countedWrap"><input type="checkbox" data-f="counted" checked><span><b>يُحتسب في مؤشر إنجاز التكاليف</b>' +
              '<span class="hint">ألغِ التحديد إذا لم يحن موعد التكليف بعد، حتى لا يظهر الطلاب «ناقصين» بسببه. تبقى درجاته داخلة في المجموع.</span></span></label>' +
            '<div class="form-note" data-f="examNote" hidden>درجة الاختبار تدخل في المجموع الكلي، ولا تؤثر في مؤشر إنجاز التكاليف.</div>' +

  const summary = m.el.querySelector('[data-t="summary"]');
  const list = m.el.querySelector('[data-t="list"]');

  const syncType = () => {
    const type = f('type').value;
    const isExam = !!TYPE_MAP[type] && TYPE_MAP[type].group !== 'work';
    f('customWrap').hidden = type !== 'custom';
    f('countedWrap').hidden = isExam;
    f('examNote').hidden = !isExam;
    f('max').placeholder = type === 'final' ? 'مثال: 40' : (type === 'midterm' ? 'مثال: 20' : 'مثال: 10');
    const t = f('title');
    if (isExam && (!t.value.trim() || t.value === autoTitle)) { t.value = EXAM_TITLES[type]; autoTitle = t.value; }
    else if (!isExam && autoTitle && t.value === autoTitle) { t.value = ''; autoTitle = ''; }
  };

    const c = getC();
    const note = f('note');
    const r = parseNum(f('max').value);
    if (!c || c.totalGrade == null || r.value === undefined) { note.hidden = true; return; }
    const others = round2(c.tasks.filter(t => t.id !== editingId).reduce((a, t) => a + t.maxGrade, 0));
    const after = round2(others + r.value);
    if (after > c.totalGrade) {
      note.textContent = 'تنبيه: سيصبح مجموع الدرجات الموزّعة ' + fmt(after) + '، وهو أكبر من إجمالي المادة (' + fmt(c.totalGrade) + ').';
      note.className = 'form-note is-warn';
    } else {
      note.textContent = 'بعد الحفظ: ' + fmt(after) + ' من ' + fmt(c.totalGrade) + (after < c.totalGrade ? '، ويتبقى ' + fmt(round2(c.totalGrade - after)) + ' للتوزيع.' : '، أي موزّعة بالكامل.');
      note.className = 'form-note';
    }
    note.hidden = false;
  };
  const itemHtml = (c, t, first, last) => {
    const ts = taskStats(c, t);
    const off = isWorkOff(t);
    return '<li class="tm-item' + (t.id === editingId ? ' is-editing' : '') + (off ? ' is-off' : '') + '" data-tid="' + esc(t.id) + '">' +
      '<div class="tm-order"><button type="button" class="tm-move" data-t="up" title="تقديم" aria-label="تقديم"' + (first ? ' disabled' : '') + '>' + icon('chevron-up') + '</button>' +
        '<button type="button" class="tm-move" data-t="down" title="تأخير" aria-label="تأخير"' + (last ? ' disabled' : '') + '>' + icon('chevron-down') + '</button></div>' +
      '<div class="tm-info"><div class="tm-title">' + esc(t.title) + '</div><div class="tm-meta">' +
        '<span class="type-chip tone-' + typeTone(t) + '">' + esc(typeLabel(t)) + '</span>' +
        '<span>الدرجة العظمى: <b>' + fmt(t.maxGrade) + '</b></span>' +
        '<span class="muted">رُصدت ' + ts.count + ' من ' + c.students.length + '</span>' +
        (off ? '<span class="pill">غير محتسب في الإنجاز</span>' : '') + '</div></div>' +
      '<div class="tm-actions"><button type="button" class="btn btn-line btn-sm" data-t="edit">' + icon('pencil') + '<span>تعديل</span></button>' +
        '<button type="button" class="btn btn-ghost btn-sm btn-danger-text" data-t="del">' + icon('trash') + '<span>حذف</span></button></div></li>';
  };
  const renderList = () => {
    const c = getC();
    if (!c) return;
    const sum = tasksTotal(c);
    const groups = courseGroups(c);
    let badge;
    if (c.totalGrade == null) badge = '<span class="pill">لم يُحدَّد إجمالي المادة</span>';
    else if (sum > c.totalGrade) badge = '<span class="pill bad">تتجاوز الإجمالي بـ ' + fmt(round2(sum - c.totalGrade)) + '</span>';
    else if (sum < c.totalGrade) badge = '<span class="pill warn">متبقٍ ' + fmt(round2(c.totalGrade - sum)) + '</span>';
    else badge = '<span class="pill ok">موزّعة بالكامل</span>';
    summary.innerHTML = '<div class="tm-sum-line"><span>مجموع الدرجات الموزّعة: <b>' + fmt(sum) + '</b>' + (c.totalGrade != null ? ' من <b>' + fmt(c.totalGrade) + '</b>' : '') + '</span>' + badge + '</div>' +
      (groups.length ? '<div class="tm-sum-groups">' + groups.map(g => '<span class="gchip g-' + g.key + '">' + g.short + ' <b>' + fmt(g.max) + '</b></span>').join('') + '</div>' : '');
    if (!c.tasks.length) {
      list.innerHTML = '<div class="tm-empty">لم تُضف أي تكاليف أو اختبارات بعد.<br>ابدأ من النموذج، أو استخدم الإضافة السريعة للاختبارات.</div>';
      return;
    }
    list.innerHTML = groups.map(g => '<div class="tm-group"><div class="tm-ghead"><span class="gdot g-' + g.key + '"></span><b>' + g.label + '</b><span class="muted">' + fmt(g.max) + ' درجة</span></div>' +
      '<ol class="tm-list">' + g.tasks.map((t, i) => itemHtml(c, t, i === 0, i === g.tasks.length - 1)).join('') + '</ol></div>').join('');
  };
  const resetForm = () => {
    editingId = null;
    autoTitle = '';
    form.reset();
    f('counted').checked = true;
    syncType();
    f('err').hidden = true;
    f('note').hidden = true;
    ftitle.textContent = 'إضافة تكليف أو اختبار';
    f('submit').innerHTML = icon('plus') + '<span>إضافة</span>';
    f('cancel').hidden = true;
    renderList();
  };
  const loadTask = tid => {
    const c = getC();
    const t = c && c.tasks.find(x => x.id === tid);
    if (!t) return;
    editingId = tid;
    autoTitle = '';
    f('title').value = t.title;
    f('type').value = t.type;
    f('custom').value = t.customType || '';
    f('max').value = fmt(t.maxGrade);
    f('counted').checked = t.counted !== false;
    syncType();
    f('err').hidden = true;
    updateNote();
    ftitle.textContent = 'تعديل: ' + t.title;
    f('submit').innerHTML = icon('check') + '<span>حفظ التعديلات</span>';
    f('cancel').hidden = false;
    renderList();
    setTimeout(() => { if (!isTypingIn(m.el)) { f('title').focus(); f('title').select(); } }, 60);
  };

  f('type').addEventListener('change', () => { syncType(); if (f('type').value === 'custom') f('custom').focus(); });
  f('title').addEventListener('input', () => { if (f('title').value !== autoTitle) autoTitle = ''; });
  f('max').addEventListener('input', updateNote);
  f('cancel').addEventListener('click', resetForm);
  m.el.querySelectorAll('[data-q]').forEach(b => b.addEventListener('click', () => {
    if (editingId) resetForm();
    f('type').value = b.getAttribute('data-q');
    syncType();
    updateNote();
    f('max').focus();
  }));

  form.addEventListener('submit', async e => {
    e.preventDefault();
    const c = getC();
    if (!c) { m.close(); return; }
    const err = f('err');
    err.hidden = true;
    const title = cleanText(f('title').value);
    const type = f('type').value;
    const custom = cleanText(f('custom').value);
    const r = parseNum(f('max').value);
    const counted = f('counted').checked;
    if (!title) return showErr(err, 'يرجى كتابة العنوان.', f('title'));
    if (type === 'custom' && !custom) return showErr(err, 'يرجى كتابة اسم النوع المخصص.', f('custom'));
    if (r.value === undefined || r.value <= 0) return showErr(err, 'الدرجة العظمى يجب أن تكون رقماً أكبر من صفر.', f('max'));
    if (r.value > 1000) return showErr(err, 'الدرجة العظمى كبيرة جداً؛ الحد الأقصى 1000.', f('max'));
    if (editingId) {
      const tid = editingId;
      const t0 = c.tasks.find(x => x.id === tid);
      if (!t0) { resetForm(); return; }
      const over = c.students.filter(s => typeof s.grades[tid] === 'number' && s.grades[tid] > r.value);
      if (over.length) {
        const ok = await confirmDialog({
          title: 'تخفيض الدرجة العظمى',
          message: 'لدى ' + arCount(over.length, 'student') + ' درجات أعلى من الدرجة العظمى الجديدة (' + fmt(r.value) + ')، وستُخفَّض درجاتهم إلى ' + fmt(r.value) + '. هل تريد المتابعة؟',
          confirmText: 'متابعة وتخفيض الدرجات'
        });
        if (!ok) return;
      }
      const c2 = getC();
      const t = c2 && c2.tasks.find(x => x.id === tid);
      if (!t) { resetForm(); return; }
      c2.students.forEach(s => { if (typeof s.grades[tid] === 'number' && s.grades[tid] > r.value) s.grades[tid] = r.value; });
      t.title = title; t.type = type; t.customType = type === 'custom' ? custom : ''; t.maxGrade = r.value; t.counted = counted;
    } else {
      c.tasks.push({ id: uid(), title, type, customType: type === 'custom' ? custom : '', maxGrade: r.value, counted, createdAt: nowIso() });
    }
    saveState();
    renderAll();
    resetForm();
    f('title').focus();
  });

  list.addEventListener('click', async e => {
    const b = e.target.closest('[data-t]');
    const li = b && b.closest('[data-tid]');
    if (!li) return;
    const tid = li.getAttribute('data-tid');
    const act = b.getAttribute('data-t');
    const c = getC();
    if (!c) return;
    const i = c.tasks.findIndex(t => t.id === tid);
    if (i < 0) return;
    if (act === 'edit') loadTask(tid);
    else if (act === 'up' || act === 'down') {
      /* التحريك داخل المجموعة نفسها */
      const grp = taskGroup(c.tasks[i]);
      let j = i;
      do { j += act === 'up' ? -1 : 1; } while (j >= 0 && j < c.tasks.length && taskGroup(c.tasks[j]) !== grp);
      if (j < 0 || j >= c.tasks.length) return;
      const tmp = c.tasks[i]; c.tasks[i] = c.tasks[j]; c.tasks[j] = tmp;
      saveState();
      renderAll();
      renderList();
      const again = list.querySelector('[data-tid="' + cssEsc(tid) + '"] [data-t="' + act + '"]');
      if (again && !again.disabled) again.focus();
    } else if (act === 'del') {
      const t = c.tasks[i];
      const ts = taskStats(c, t);
      const ok = await confirmDialog({
        title: 'حذف العمود',
        message: 'هل تريد حذف «' + t.title + '»؟' + (ts.count ? ' ستُحذف معه الدرجات المرصودة فيه (' + ts.count + ').' : ' لا توجد درجات مرصودة فيه.'),
        confirmText: 'حذف',
        danger: true
      });
      if (!ok) return;
      commitWithUndo(() => {
        const cc = getC();
        if (!cc) return '';
        cc.tasks = cc.tasks.filter(x => x.id !== tid);
        cc.students.forEach(s => { delete s.grades[tid]; });
        if (editingId === tid) editingId = null;
        return 'حُذف «' + t.title + '».';
      }, () => { renderAll(); resetForm(); });
    }
  });

  syncType();
  renderList();
  if (editId) loadTask(editId);
  else if (focusNew) setTimeout(() => { if (!isTypingIn(m.el)) f('title').focus(); }, 60);
}

/* ============================================================
   استيراد أسماء الطلاب من Excel (أو باللصق من Excel)
   ============================================================ */
let namesModal = null;
const HEADER_KEYS = ['الاسم', 'اسم الطالب', 'أسماء الطلاب', 'الأسماء', 'الطالب', 'الطلاب', 'اسم', 'الاسم الكامل', 'الاسم الرباعي', 'الاسم الثلاثي', 'اسم الطالب الرباعي', 'اسم الطالب الثلاثي', 'name', 'names', 'student', 'students', 'student name', 'full name'].map(nameKey);
/* الأنماط تُكتب ثم تُوحَّد بالطريقة نفسها التي يُوحَّد بها نص الخلايا */
const wordsRe = (words, whole) => new RegExp(whole ? '(^| )(' + words.map(normAr).join('|') + ')( |$)' : '(' + words.map(normAr).join('|') + ')');
const BAD_HEADER_RE = wordsRe(['مقرر', 'مادة', 'كلية', 'قسم', 'شعبة', 'مرشد', 'أستاذ', 'محاضر', 'مدرس', 'عضو', 'course', 'instructor', 'teacher', 'faculty', 'college', 'department', 'advisor']);
const NAME_HEADER_RE = wordsRe(['اسم', 'الاسم', 'الأسماء', 'أسماء', 'name', 'names', 'الطالب', 'الطلاب', 'student', 'students'], true);
const FIRST_RE = wordsRe(['الاسم الأول', 'first']);
const FAMILY_RE = wordsRe(['العائلة', 'اسم العائلة', 'اللقب', 'القبيلة', 'family', 'last', 'surname']);
const SUSPECT_WORDS = new Set(['عدد', 'العدد', 'المجموع', 'مجموع', 'الإجمالي', 'إجمالي', 'توقيع', 'التوقيع', 'رئيس', 'مدير', 'عميد', 'وكيل', 'ملاحظة', 'ملاحظات', 'كشف', 'المقرر', 'مقرر', 'المادة', 'مادة', 'الشعبة', 'شعبة', 'الكلية', 'كلية', 'الجامعة', 'جامعة', 'القسم', 'قسم', 'الفصل', 'الدراسي', 'التاريخ', 'تاريخ', 'صفحة', 'total', 'signature', 'course', 'section', 'date', 'page'].map(normAr));

/* تنظيف نص الخلية: حذف الترقيم والرموز في البداية والأرقام في النهاية */
function cleanNameCell(v) {
  const s = String(v == null ? '' : v)
    .replace(/[​‎‏‪-‮⁦-⁩﻿]/g, '')
    .replace(/^[\s\d٠-٩۰-۹.\-–—()[\]:\/\\#*•·▪◦●○►✓✔]+/u, '')
    .replace(/[\s\d٠-٩۰-۹.\-–—#*]+$/u, '')
    .replace(/^["'«“]+|["'»”]+$/gu, '');
  const out = cleanText(s);
  return /\p{L}/u.test(out) ? out : '';
}
function isSuspectName(name) {
  if (/[:=]|\d/.test(name)) return true;
  const words = normAr(name).split(' ');
  return words.length > 8 || words.some(w => SUSPECT_WORDS.has(w));
}

/* التعرف على صف العناوين وعمود الأسماء (أو أعمدته إن كان الاسم مقسّماً) */
function detectLayout(rows) {
  for (let r = 0; r < Math.min(rows.length, 15); r++) {
    const raw = rows[r] || [];
    const cells = raw.map(v => normAr(v));
    const filled = cells.filter(Boolean).length;
    if (!filled || cells.some(v => /\d{5,}/.test(v))) continue;
    const short = v => v && v.split(' ').length <= 4;
    const first = cells.findIndex(v => short(v) && FIRST_RE.test(v));
    const fam = cells.findIndex(v => short(v) && FAMILY_RE.test(v));
    if (first >= 0 && fam >= 0 && first !== fam) {
      /* من عمود الاسم الأول إلى عمود العائلة، أياً كان ترتيبهما في الورقة */
      const cols = [], step = first < fam ? 1 : -1;
      for (let c = first; c !== fam + step; c += step) if (cells[c]) cols.push(c);
      return { headerRow: r, cols };
    }
    const cand = [];
    cells.forEach((v, c) => { if (v && v.split(' ').length <= 3 && NAME_HEADER_RE.test(v) && !BAD_HEADER_RE.test(v)) cand.push(c); });
    if (cand.length && (filled >= 2 || HEADER_KEYS.indexOf(nameKey(raw[cand[0]])) >= 0)) {
      let pick = cand.find(c => /(طالب|student)/.test(cells[c]));
      if (pick === undefined) pick = cand[0];
      return { headerRow: r, cols: [pick] };
    }
  }
  let width = 0;
  rows.slice(0, 400).forEach(r => { width = Math.max(width, r.length); });
  let best = 0, bestScore = -1;
  for (let c = 0; c < Math.min(width, XL_MAX_COLS); c++) {
    let score = 0;
    for (let r = 0; r < Math.min(rows.length, 400); r++) {
      const nm = cleanNameCell((rows[r] || [])[c]);
      if (!nm || /\d/.test(nm)) continue;
      const w = nm.split(' ').length;
      score += (w >= 2 && w <= 7) ? 2 : (w === 1 ? 0.5 : 0);
    }
    if (score > bestScore) { bestScore = score; best = c; }
  }
  return { headerRow: -1, cols: [best] };
}

function analyzeGrid(rows, layout, course) {
  const existing = new Set(course.students.map(s => nameKey(s.name)));
  const seen = new Set();
  const out = { add: [], dupExisting: [], dupFile: [], noName: 0, header: 0, first: -1 };
  for (let r = layout.headerRow + 1; r < rows.length; r++) {
    const row = rows[r] || [];
    if (!row.some(Boolean)) continue;
    const raw = layout.cols.map(c => row[c] || '').filter(Boolean).join(' ');
    const name = raw ? cleanNameCell(raw) : '';
    if (!name) { out.noName++; continue; }
    const key = nameKey(name);
    if (HEADER_KEYS.indexOf(key) >= 0) { out.header++; continue; }
    if (out.first < 0) out.first = r;
    if (existing.has(key)) { out.dupExisting.push(name); continue; }
    if (seen.has(key)) { out.dupFile.push(name); continue; }
    seen.add(key);
    out.add.push({ name, key, suspect: isSuspectName(name) });
  }
  const multi = out.add.filter(x => x.name.indexOf(' ') > 0).length;
  if (out.add.length >= 4 && multi / out.add.length >= 0.6) out.add.forEach(x => { if (x.name.indexOf(' ') < 0) x.suspect = true; });
  return out;
}

async function handleNamesFile(file) {

function openImportNamesModal(opts) {
  opts = opts || {};
  const course = currentCourse();
  if (!course) return;
  const courseId = course.id;
  const getC = () => courseById(courseId);
  const st = { mode: 'file', book: null, fileName: '', sheet: 0, pasteRows: [], layout: { headerRow: -1, cols: [0] }, multi: false, manual: false, off: new Set(), onSuspect: new Set(), res: null };
  let self = null;
  const m = openModal({
    title: 'استيراد أسماء الطلاب', icon: 'file-up', size: 'wide',
    body: '<p class="dialog-text">تُضاف الأسماء إلى مادة <b>' + esc(course.name) + '</b>.</p>' +
      '<div class="seg" role="tablist" aria-label="مصدر الأسماء">' +
        '<button type="button" class="seg-btn is-on" role="tab" aria-selected="true" data-i="mode-file">ملف Excel</button>' +
        '<button type="button" class="seg-btn" role="tab" aria-selected="false" data-i="mode-paste">لصق من Excel</button></div>' +
      '<div data-i="filePane"></div>' +
      '<div data-i="pastePane" hidden><label class="field"><span class="label">انسخ عمود الأسماء (أو الجدول كله) من Excel والصقه هنا</span>' +
        '<textarea data-i="text" rows="7" spellcheck="false" placeholder="محمد عبدالله الحربي&#10;خالد سليمان العتيبي&#10;فيصل ناصر الدوسري"></textarea></label></div>' +
      '<div data-i="layout"></div>' +
      '<div data-i="result" aria-live="polite"></div>',
    footer: '<button type="button" class="btn btn-primary" data-i="add" disabled>' + icon('user-plus') + '<span>إضافة الأسماء</span></button>' +
      '<button type="button" class="btn btn-ghost" data-close>إلغاء</button>',
    onClose: () => { if (namesModal === self) namesModal = null; }
  });
  self = m;
  namesModal = m;
  const q = k => m.el.querySelector('[data-i="' + k + '"]');
  const filePane = q('filePane'), pastePane = q('pastePane'), ta = q('text'), layoutEl = q('layout'), resultEl = q('result'), addBtn = q('add');
  const rowsNow = () => st.mode === 'file' ? (st.book ? st.book.sheets[st.sheet].rows : []) : st.pasteRows;
  const isOn = x => x.suspect ? st.onSuspect.has(x.key) : !st.off.has(x.key);
  const selected = () => (st.res ? st.res.add.filter(isOn) : []);

  const renderFilePane = () => {
    if (!st.book) {
      filePane.innerHTML = '<div class="dropzone" data-i="drop" role="button" tabindex="0">' + icon('file-up') +
        '<b>اختر ملف Excel أو اسحبه إلى هنا</b><span class="hint">' + LTR('.xlsx') + ' أو ' + LTR('.xls') + '، ويُقبل أيضاً ' + LTR('.csv') + '</span></div>';
      return;
    }
    filePane.innerHTML = '<div class="file-chip">' + icon('check-circle') + '<b>' + esc(st.fileName) + '</b>' +
      '<button type="button" class="btn btn-line btn-sm" data-i="change">' + icon('file-up') + '<span>تغيير الملف</span></button></div>';
  };

  const renderLayout = () => {
    const rows = rowsNow();
    const sheets = st.mode === 'file' && st.book ? st.book.sheets : [];
    let width = 0;
    rows.slice(0, 60).forEach(r => { width = Math.max(width, r.length); });
    const visCols = [];
    for (let c = 0; c < width && visCols.length < 30; c++) if (rows.slice(0, 60).some(r => r[c])) visCols.push(c);
    st.layout.cols.forEach(c => { if (visCols.indexOf(c) < 0 && c < XL_MAX_COLS) visCols.push(c); });
    visCols.sort((a, b) => a - b);
    if (!rows.length || (visCols.length <= 1 && sheets.length <= 1)) { layoutEl.innerHTML = ''; return; }
    const head = st.layout.headerRow >= 0 ? rows[st.layout.headerRow] || [] : [];
    const dataRows = [];
    for (let r = st.layout.headerRow + 1; r < rows.length && dataRows.length < 5; r++) if ((rows[r] || []).some(Boolean)) dataRows.push(r);
    const on = c => st.layout.cols.indexOf(c) >= 0;
    const tr = (r, cls) => '<tr' + (cls ? ' class="' + cls + '"' : '') + '><td class="xl-rn">' + (r + 1) + '</td>' +
      visCols.map(c => '<td' + (on(c) ? ' class="is-on"' : '') + '>' + esc((rows[r] || [])[c] || '') + '</td>').join('') + '</tr>';
    layoutEl.innerHTML =
      '<div class="xl-bar">' +
        (sheets.length > 1 ? '<label class="xl-sheet">الورقة <select data-i="sheet">' + sheets.map((s, i) => '<option value="' + i + '"' + (i === st.sheet ? ' selected' : '') + '>' + esc(s.name) + '</option>').join('') + '</select></label>' : '') +
        '<span class="xl-cols">' + (st.layout.cols.length > 1 ? 'أعمدة الاسم:' : 'عمود الأسماء:') +
          st.layout.cols.map(c => '<span class="xl-tag"><b>' + colName(c) + '</b>' + (head[c] ? '<span>' + esc(head[c]) + '</span>' : '') + '</span>').join('<span class="xl-plus">+</span>') + '</span>' +
        (st.res && st.res.first >= 0 ? '<span class="muted">البيانات تبدأ من الصف ' + (st.res.first + 1) + '</span>' : '') +
      '</div>' +
      (visCols.length > 1
        ? '<div class="xl-preview"><table><thead><tr><th class="xl-rn"></th>' + visCols.map(c => '<th><button type="button" class="xl-col' + (on(c) ? ' is-on' : '') + '" data-col="' + c + '" aria-pressed="' + on(c) + '" title="' + esc(head[c] ? 'العمود ' + colName(c) + ': ' + head[c] : 'العمود ' + colName(c)) + '">' + colName(c) + '</button></th>').join('') + '</tr></thead><tbody>' +
          (st.layout.headerRow >= 0 ? tr(st.layout.headerRow, 'is-head') : '') + dataRows.map(r => tr(r, '')).join('') + '</tbody></table></div>' +
          '<div class="xl-foot"><span class="hint">انقر حرف العمود الذي فيه الأسماء.</span>' +
          '<label class="check-inline"><input type="checkbox" data-i="multi"' + (st.multi ? ' checked' : '') + '>الاسم موزّع على أكثر من عمود</label></div>'
        : '');
  };

  const renderResult = () => {
    const c = getC();
    const rows = rowsNow();
    if (!c || !rows.length) {
      st.res = null;
      resultEl.innerHTML = '';
      updateAdd();
      return;
    }
    st.res = analyzeGrid(rows, st.layout, c);
    const r = st.res;
    const dup = r.dupExisting.length + r.dupFile.length;
    const chips = ['<span class="pill' + (r.add.length ? ' ok' : '') + '">' + icon('user-plus') + 'جديد: <b>' + r.add.length + '</b></span>'];
    if (dup) chips.push('<span class="pill warn">مكرر سيُتجاهل: <b>' + dup + '</b></span>');
    if (r.noName) chips.push('<span class="pill">صفوف بلا اسم: <b>' + r.noName + '</b></span>');
    if (r.header) chips.push('<span class="pill">سطر عنوان: <b>' + r.header + '</b></span>');
    let h = '<div class="imp-stats">' + chips.join('') + '</div>';
    if (r.add.length) {
      h += '<div class="nm-head"><b>الأسماء الجديدة</b><button type="button" class="link-btn" data-i="all">تحديد الكل</button><button type="button" class="link-btn" data-i="none">إلغاء التحديد</button></div>' +
        '<ul class="nm-list">' + r.add.map(x => {
          const sel = isOn(x);
          return '<li' + (sel ? '' : ' class="is-off"') + '><label><input type="checkbox" data-k="' + esc(x.key) + '"' + (sel ? ' checked' : '') + '><span>' + esc(x.name) + '</span>' +
            (x.suspect ? '<em>قد لا يكون اسماً</em>' : '') + '</label></li>';
        }).join('') + '</ul>';
    } else {
      h += '<div class="notes-empty">لا توجد أسماء جديدة لإضافتها' + (rows.length ? ' من العمود المختار.' : '.') + '</div>';
    }
    if (dup) {
      h += '<details class="imp-details"><summary>الأسماء المكررة التي ستُتجاهل (' + dup + ')</summary><ul class="imp-list">' +
        r.dupExisting.map(x => '<li>' + esc(x) + ' <span class="muted">(موجود في المادة)</span></li>').join('') +
        r.dupFile.map(x => '<li>' + esc(x) + ' <span class="muted">(مكرر في الملف)</span></li>').join('') + '</ul></details>';
    }
    resultEl.innerHTML = h;
    updateAdd();
  };

  const updateAdd = () => {
    const n = selected().length;
    addBtn.disabled = !n;
    addBtn.querySelector('span').textContent = n ? 'إضافة ' + arCount(n, 'student') : 'إضافة الأسماء';
  };
  const relayout = () => { renderResult(); renderLayout(); };
  const detect = () => {
    st.layout = detectLayout(rowsNow());
    st.multi = st.layout.cols.length > 1;
    st.manual = false;
  };
  const setMode = mode => {
    st.mode = mode;
    q('mode-file').classList.toggle('is-on', mode === 'file');
    q('mode-paste').classList.toggle('is-on', mode === 'paste');
    q('mode-file').setAttribute('aria-selected', String(mode === 'file'));
    q('mode-paste').setAttribute('aria-selected', String(mode === 'paste'));
    filePane.hidden = mode !== 'file';
    pastePane.hidden = mode !== 'paste';
    detect();
    relayout();
    if (mode === 'paste') ta.focus();
  };

  m.loadBook = (book, fileName) => {
    st.book = book;
    st.fileName = fileName;
    st.sheet = Math.max(0, book.sheets.findIndex(s => s.rows.some(r => r.some(Boolean))));
    st.off.clear();
    st.onSuspect.clear();
    renderFilePane();
    if (st.mode !== 'file') setMode('file');
    else { detect(); relayout(); }
  };

  m.el.addEventListener('click', e => {
    const b = e.target.closest('[data-i],[data-col]');
    if (!b || !m.el.contains(b)) return;
    if (b.hasAttribute('data-col')) {
      const col = +b.getAttribute('data-col');
      let cols = st.layout.cols.slice();
      if (st.multi) {
        const i = cols.indexOf(col);
        if (i >= 0) { if (cols.length > 1) cols.splice(i, 1); }
        else cols.push(col);
        cols.sort((a, b2) => a - b2);
      } else cols = [col];
      st.layout = { headerRow: st.layout.headerRow, cols };
      st.manual = true;
      relayout();
      return;
    }
    const k = b.getAttribute('data-i');
    if (k === 'mode-file' && st.mode !== 'file') setMode('file');
    else if (k === 'mode-paste' && st.mode !== 'paste') setMode('paste');
    else if (k === 'drop' || k === 'change') $('#fileNames').click();
    else if (k === 'all' || k === 'none') {
      if (!st.res) return;
      st.res.add.forEach(x => {
        if (x.suspect) { if (k === 'all') st.onSuspect.add(x.key); else st.onSuspect.delete(x.key); }
        else if (k === 'all') st.off.delete(x.key); else st.off.add(x.key);
      });
      renderResult();
    }
  });
  m.el.addEventListener('change', e => {
    const t = e.target;
    if (t.hasAttribute('data-k')) {
      const key = t.getAttribute('data-k');
      const item = st.res && st.res.add.find(x => x.key === key);
      if (!item) return;
      if (item.suspect) { if (t.checked) st.onSuspect.add(key); else st.onSuspect.delete(key); }
      else if (t.checked) st.off.delete(key); else st.off.add(key);
      t.closest('li').classList.toggle('is-off', !t.checked);
      updateAdd();
    } else if (t.getAttribute('data-i') === 'sheet') {
      st.sheet = +t.value;
      detect();
      relayout();
    } else if (t.getAttribute('data-i') === 'multi') {
      st.multi = t.checked;
      if (!st.multi && st.layout.cols.length > 1) st.layout = { headerRow: st.layout.headerRow, cols: [st.layout.cols[0]] };
      relayout();
    }
  });
  m.el.addEventListener('keydown', e => {
    if (e.target.getAttribute && e.target.getAttribute('data-i') === 'drop' && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); $('#fileNames').click(); }
  });
  /* سحب الملف وإفلاته في أي مكان داخل النافذة */
  m.el.addEventListener('dragover', e => {
    if (!e.dataTransfer || Array.prototype.indexOf.call(e.dataTransfer.types || [], 'Files') < 0) return;
    e.preventDefault();
    const dz = q('drop');
    if (dz) dz.classList.add('is-over');
  });
  m.el.addEventListener('dragleave', e => { const dz = q('drop'); if (dz && !m.el.contains(e.relatedTarget)) dz.classList.remove('is-over'); });
  m.el.addEventListener('drop', e => {
    if (!e.dataTransfer || !e.dataTransfer.files || !e.dataTransfer.files.length) return;
    e.preventDefault();
    const dz = q('drop');
    if (dz) dz.classList.remove('is-over');
    handleNamesFile(e.dataTransfer.files[0]);
  });
  let timer = null;
  ta.addEventListener('input', () => {
    clearTimeout(timer);
    timer = setTimeout(() => {
      st.pasteRows = parseDelimited(ta.value);
      const width = st.pasteRows.reduce((w, r) => Math.max(w, r.length), 0);
      if (!st.manual || st.layout.cols.some(c => c >= width)) detect();
      relayout();
    }, 150);
  });
  addBtn.addEventListener('click', () => {
    const c = getC();
    if (!c) { m.close(); return; }
    const pick = selected();
    if (!pick.length) return;
    const r = st.res;
    const dup = r.dupExisting.length + r.dupFile.length;
    const skippedSel = r.add.length - pick.length;
    m.close();
    commitWithUndo(() => {
      const cc = getC();
      pick.forEach(x => cc.students.push({ id: uid(), name: x.name, grades: {}, notes: [], createdAt: nowIso() }));
      const notes = [];
      if (dup) notes.push('مكرر ' + dup);
      if (skippedSel) notes.push('غير محدد ' + skippedSel);
      if (r.noName) notes.push('صفوف بلا اسم ' + r.noName);
      return 'أُضيف ' + arCount(pick.length, 'student') + ' إلى «' + cc.name + '».' + (notes.length ? ' المتجاهَل: ' + notes.join('، ') + '.' : '');
    });
  });

  renderFilePane();
  if (opts.book) m.loadBook(opts.book, opts.fileName || '');
  else if (opts.paste) setMode('paste');
  else relayout();
}

/* ============================================================
   النسخ الاحتياطي والاستعادة
   ============================================================ */
function downloadText(filename, text) {
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.rel = 'noopener';
  a.style.display = 'none';
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 30000);
}

function exportBackup(silent) {
  if (!state.courses.length) {
    if (!silent) toast('لا توجد بيانات بعد لتصديرها. أضف مادة أولاً.', { type: 'info' });
    return null;
  }
  const now = new Date();
  const name = 'Backup_Courses_' + now.getFullYear() + '-' + pad2(now.getMonth() + 1) + '-' + pad2(now.getDate()) + '_' + pad2(now.getHours()) + '-' + pad2(now.getMinutes()) + '.txt';
  const payload = { app: APP_ID, kind: 'backup', version: DATA_VERSION, exportedAt: now.toISOString(), summary: countsOf(state), data: state };
  downloadText(name, '﻿' + JSON.stringify(payload, null, 2));
  prefs.lastBackupAt = now.toISOString();
  savePrefs();
  updateSaveStatus();
  if (!silent) toast('نُزِّلت النسخة الاحتياطية: ' + LTR(name), { type: 'success', duration: 5500 });
  return name;
}

function parseBackupText(text) {
  const t = String(text || '').replace(/^﻿/, '').trim();
  if (!t) return { ok: false, error: 'الملف فارغ.' };
  let obj = null;
  try { obj = JSON.parse(t); }
  catch (e) {
    const a = t.indexOf('{'), b = t.lastIndexOf('}');
    if (a >= 0 && b > a) { try { obj = JSON.parse(t.slice(a, b + 1)); } catch (e2) { obj = null; } }
  }
  if (!obj || typeof obj !== 'object') return { ok: false, error: 'هذا الملف لا يحتوي على نسخة احتياطية صالحة. اختر ملف ' + TXT + ' الذي صدّرته سابقاً من زر «تصدير نسخة احتياطية».' };
  if (obj.app && obj.app !== APP_ID) return { ok: false, error: 'هذا الملف نسخة احتياطية لبرنامج آخر، ولا يمكن استعادته هنا.' };
  const res = sanitizeData(obj);
  if (!res.ok) return res;
  return { ok: true, data: res.data, exportedAt: isIso(obj.exportedAt) ? obj.exportedAt : null };
}

async function handleBackupFile(file) {
  let text;
  try { text = await readTextFile(file); }
  catch (e) { alertDialog({ title: 'تعذّرت قراءة الملف', message: 'لم يتمكن البرنامج من قراءة الملف «' + file.name + '».', danger: true }); return; }
  const parsed = parseBackupText(text);
  if (!parsed.ok) { alertDialog({ title: 'ملف غير صالح', message: parsed.error, danger: true }); return; }
  openRestoreModal(parsed, file.name);
}

  };

  bDirect.addEventListener('click', () => run(false));

function performDelete(scope, mode, courseId, backedUp) {
  commitWithUndo(() => {
    let msg;
    if (scope === 'all') {
      state.courses = [];
      state.activeCourseId = null;
      msg = 'حُذفت بيانات جميع المواد.';
    } else {
      const course = courseById(courseId);
      if (!course) return 'لم يُعثر على المادة.';
      if (mode === 'grades') {
        course.students.forEach(s => { s.grades = {}; s.notes = []; });
        msg = 'مُسحت درجات «' + course.name + '» وملاحظاتها.';
      } else if (mode === 'students') {
        course.students = [];
        msg = 'حُذف طلاب «' + course.name + '» وبياناتهم.';
      } else {
        const i = state.courses.indexOf(course);
        state.courses.splice(i, 1);
        if (state.activeCourseId === course.id) state.activeCourseId = state.courses.length ? state.courses[Math.min(i, state.courses.length - 1)].id : null;
        msg = 'حُذفت مادة «' + course.name + '» بالكامل.';
      }
    }
    ui.search = '';
    ui.filter = 'all';
    return msg + (backedUp ? ' نُزّلت نسخة احتياطية قبل الحذف.' : '');
  });
}
