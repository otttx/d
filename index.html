/* ============================================================
   قراءة ملفات Excel دون مكتبات خارجية
   ‎.xlsx‎: ملف ZIP بداخله XML   |   ‎.xls‎: ملف مركّب بصيغة BIFF8
   وتُقبل أيضاً: CSV والنص المفصول بـ Tab وجداول HTML المحفوظة بامتداد xls
   الناتج دائماً: { sheets: [{ name, rows: [[نص الخلية، ...], ...] }] }
   ============================================================ */
const XL_MAX_ROWS = 20000;
const XL_MAX_COLS = 200;
const NS_REL = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships';
const NS_SS = 'urn:schemas-microsoft-com:office:spreadsheet';

function bookError(msg) { const e = new Error(msg); e.userMessage = msg; return e; }

function readFileBytes(file) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onerror = () => reject(fr.error || new Error('read error'));
    fr.onload = () => resolve(new Uint8Array(fr.result));
    fr.readAsArrayBuffer(file);
  });
}
/* قراءة ملف نصي مع التعرف على الترميز: UTF-8 / UTF-16 / Windows-1256 */
async function readTextFile(file) { return decodeBytes(await readFileBytes(file)); }
function decodeBytes(b) {
  if (b.length >= 3 && b[0] === 0xEF && b[1] === 0xBB && b[2] === 0xBF) return new TextDecoder('utf-8').decode(b.subarray(3));
  if (b.length >= 2 && b[0] === 0xFF && b[1] === 0xFE) return new TextDecoder('utf-16le').decode(b.subarray(2));
  if (b.length >= 2 && b[0] === 0xFE && b[1] === 0xFF) return new TextDecoder('utf-16be').decode(b.subarray(2));
  try { return new TextDecoder('utf-8', { fatal: true }).decode(b); }
  catch (e) {
    try { return new TextDecoder('windows-1256').decode(b); }
    catch (e2) { return new TextDecoder('utf-8').decode(b); }
  }
}
function looksBinary(text) {
  if (!text) return false;
  const sample = text.slice(0, 4000);
  let bad = 0;
  for (let i = 0; i < sample.length; i++) {
    const c = sample.charCodeAt(i);
    if ((c < 32 && c !== 9 && c !== 10 && c !== 13) || c === 0xFFFD) bad++;
  }
  return bad / sample.length > 0.02;
}

/* نقطة الدخول: تحديد نوع الملف من محتواه لا من امتداده */
async function readBook(file) {
  const b = await readFileBytes(file);
  if (!b.length) throw bookError('الملف فارغ.');
  if (b[0] === 0x50 && b[1] === 0x4B && b[2] === 0x03 && b[3] === 0x04) return readXlsx(b);
  if (b[0] === 0xD0 && b[1] === 0xCF && b[2] === 0x11 && b[3] === 0xE0) return readXls(b);
  const text = decodeBytes(b);
  const t = text.replace(/^﻿/, '').trimStart();
  if (t[0] === '<') {
    if (/<table[\s>]/i.test(t)) return readHtmlTables(t);
    if (t.indexOf(NS_SS) >= 0) return readSpreadsheetML(t);
  }
  if (looksBinary(text)) throw bookError('تعذّر التعرف على صيغة الملف. افتحه في Excel واحفظه بصيغة ' + LTR('.xlsx') + ' ثم أعد المحاولة.');
  return { sheets: [{ name: 'الورقة 1', rows: parseDelimited(text) }] };
}

/* تحويل مصفوفة متفرقة إلى صفوف متصلة وحذف الصفوف الفارغة في النهاية */
function densify(rows) {
  const out = [];
  for (let i = 0; i < rows.length; i++) {
    const r = rows[i] || [];
    const arr = [];
    for (let j = 0; j < r.length; j++) arr.push(r[j] == null ? '' : r[j]);
    out.push(arr);
  }
  while (out.length && !out[out.length - 1].some(Boolean)) out.pop();
  return out;
}
function fmtCellNumber(n) {
  if (!isFinite(n)) return '';
  return Number.isInteger(n) ? String(n) : String(Math.round(n * 1e6) / 1e6);
}
function concatBytes(parts) {
  let len = 0;
  parts.forEach(p => { len += p.length; });
  const out = new Uint8Array(len);
  let o = 0;
  parts.forEach(p => { out.set(p, o); o += p.length; });
  return out;
}
function utf16(bytes) { return new TextDecoder('utf-16le').decode(bytes); }
function latin1(bytes) {
  let s = '';
  for (let i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
  return s;
}

/* ---------- ZIP ---------- */
function unzipIndex(b) {
  const dv = new DataView(b.buffer, b.byteOffset, b.byteLength);
  let eocd = -1;
  for (let i = b.length - 22; i >= Math.max(0, b.length - 65557); i--) {
    if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw bookError('ملف Excel تالف أو غير مكتمل.');
  const count = dv.getUint16(eocd + 10, true);
  let p = dv.getUint32(eocd + 16, true);
  const entries = new Map();
  for (let i = 0; i < count; i++) {
    if (p + 46 > b.length || dv.getUint32(p, true) !== 0x02014b50) break;
    const nlen = dv.getUint16(p + 28, true), xlen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true);
    const name = new TextDecoder('utf-8').decode(b.subarray(p + 46, p + 46 + nlen)).replace(/\\/g, '/').replace(/^\//, '');
    entries.set(name.toLowerCase(), {
      method: dv.getUint16(p + 10, true), crc: dv.getUint32(p + 16, true),
      csize: dv.getUint32(p + 20, true), usize: dv.getUint32(p + 24, true), lho: dv.getUint32(p + 42, true)
    });
    p += 46 + nlen + xlen + clen;
  }
  return {
    has: n => entries.has(n.toLowerCase()),
    async text(n) {
      const e = entries.get(n.toLowerCase());
      if (!e) return null;
      const q = e.lho;
      if (q + 30 > b.length || dv.getUint32(q, true) !== 0x04034b50) throw bookError('ملف Excel تالف.');
      const start = q + 30 + dv.getUint16(q + 26, true) + dv.getUint16(q + 28, true);
      const raw = b.subarray(start, start + e.csize);
      let data;
      if (e.method === 0) data = raw;
      else if (e.method === 8) data = await inflateRaw(raw, e);
      else throw bookError('ملف Excel مضغوط بطريقة غير مدعومة.');
      return new TextDecoder('utf-8').decode(data);
    }
  };
}
async function inflateRaw(raw, e) {
  if (typeof DecompressionStream === 'undefined') throw bookError('هذا المتصفح لا يدعم قراءة ملفات Excel. استخدم إصداراً حديثاً من Chrome أو Edge أو Firefox أو Safari.');
  const run = (bytes, fmt) => new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream(fmt))).arrayBuffer().then(x => new Uint8Array(x));
  try { return await run(raw, 'deflate-raw'); }
  catch (err) {
    /* بديل للمتصفحات الأقدم: تغليف البيانات بصيغة gzip باستخدام CRC والحجم من فهرس ZIP */
    const gz = new Uint8Array(raw.length + 18);
    gz.set([0x1f, 0x8b, 8, 0, 0, 0, 0, 0, 0, 0xff]);
    gz.set(raw, 10);
    const t = new DataView(gz.buffer);
    t.setUint32(10 + raw.length, e.crc >>> 0, true);
    t.setUint32(14 + raw.length, e.usize >>> 0, true);
    return run(gz, 'gzip');
  }
}

/* ---------- XLSX ---------- */
function xmlDoc(text) {
  const doc = new DOMParser().parseFromString(text, 'application/xml');
  if (doc.getElementsByTagName('parsererror').length) throw bookError('تعذّرت قراءة محتوى ملف Excel.');
  return doc;
}
function byTag(node, tag) { return node.getElementsByTagNameNS('*', tag); }
function colIndex(ref) {
  let n = 0;
  for (let i = 0; i < ref.length; i++) {
    const c = ref.charCodeAt(i);
    if (c >= 65 && c <= 90) n = n * 26 + (c - 64);
    else if (c >= 97 && c <= 122) n = n * 26 + (c - 96);
    else break;
  }
  return n - 1;
}
function colName(i) {
  let s = '';
  i += 1;
  while (i > 0) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); }
  return s;
}
/* نص خلية: يجمع أجزاء النص المنسّق ويتجاهل الكتابة الصوتية */
function richText(el) {
  let s = '';
  const ts = byTag(el, 't');
  for (let i = 0; i < ts.length; i++) {
    let p = ts[i].parentNode, phonetic = false;
    while (p && p !== el) { if (p.localName === 'rPh') { phonetic = true; break; } p = p.parentNode; }
    if (!phonetic) s += ts[i].textContent;
  }
  return s;
}
function resolvePath(base, target) {
  const parts = (target.charAt(0) === '/' ? target.slice(1) : base + target).split('/');
  const out = [];
  parts.forEach(seg => { if (seg === '..') out.pop(); else if (seg && seg !== '.') out.push(seg); });
  return out.join('/');
}
async function readXlsx(b) {
  const zip = unzipIndex(b);
  if (!zip.has('xl/workbook.xml')) {
    if (zip.has('word/document.xml')) throw bookError('هذا ملف Word وليس ملف Excel.');
    if (zip.has('ppt/presentation.xml')) throw bookError('هذا ملف عرض تقديمي وليس ملف Excel.');
    throw bookError('هذا الملف ليس ملف Excel صالحاً.');
  }
  const wb = xmlDoc(await zip.text('xl/workbook.xml'));
  const rels = {};
  let sstPath = 'xl/sharedStrings.xml';
  const relsXml = await zip.text('xl/_rels/workbook.xml.rels');
  if (relsXml) {
    Array.prototype.forEach.call(byTag(xmlDoc(relsXml), 'Relationship'), r => {
      rels[r.getAttribute('Id')] = r.getAttribute('Target') || '';
      if (/sharedStrings$/.test(r.getAttribute('Type') || '')) sstPath = resolvePath('xl/', r.getAttribute('Target') || '');
    });
  }
  const sstXml = await zip.text(sstPath);
  const shared = sstXml ? Array.prototype.map.call(byTag(xmlDoc(sstXml), 'si'), richText) : [];
  const sheets = [];
  const sheetEls = byTag(wb, 'sheet');
  for (let k = 0; k < sheetEls.length; k++) {
    const el = sheetEls[k];
    const rid = el.getAttributeNS(NS_REL, 'id') || el.getAttribute('r:id');
    const target = rels[rid] || ('worksheets/sheet' + (k + 1) + '.xml');
    const xml = await zip.text(resolvePath('xl/', target));
    if (!xml) continue;
    sheets.push({ name: el.getAttribute('name') || ('الورقة ' + (k + 1)), rows: xlsxRows(xmlDoc(xml), shared) });
  }
  if (!sheets.length) throw bookError('لا توجد أوراق عمل في هذا الملف.');
  return { sheets };
}
function xlsxRows(doc, shared) {
  const rows = [];
  const rowEls = byTag(doc, 'row');
  let nextR = 0;
  for (let i = 0; i < rowEls.length; i++) {
    const re = rowEls[i];
    const ra = parseInt(re.getAttribute('r'), 10);
    const r = ra > 0 ? ra - 1 : nextR;
    nextR = r + 1;
    if (r >= XL_MAX_ROWS) break;
    const cells = byTag(re, 'c');
    let nextC = 0;
    for (let j = 0; j < cells.length; j++) {
      const c = cells[j];
      const ref = c.getAttribute('r');
      const ci = ref ? colIndex(ref) : nextC;
      nextC = ci + 1;
      if (ci < 0 || ci >= XL_MAX_COLS) continue;
      const t = c.getAttribute('t');
      let v = '';
      if (t === 's') {
        const vEl = byTag(c, 'v')[0];
        const idx = vEl ? parseInt(vEl.textContent, 10) : NaN;
        v = (idx >= 0 && shared[idx] != null) ? shared[idx] : '';
      } else if (t === 'inlineStr') {
        const is = byTag(c, 'is')[0];
        v = is ? richText(is) : '';
      } else {
        const vEl = byTag(c, 'v')[0];
        v = vEl ? vEl.textContent : '';
        if (t === 'b') v = v === '1' ? 'TRUE' : 'FALSE';
        else if (t !== 'str' && t !== 'e' && v !== '' && isFinite(+v)) v = fmtCellNumber(+v);
      }
      v = String(v).trim();
      if (!v) continue;
      (rows[r] || (rows[r] = []))[ci] = v;
    }
  }
  return densify(rows);
}

/* ---------- XLS: الملف المركّب (Compound File) ---------- */
function readCfb(b) {
  const dv = new DataView(b.buffer, b.byteOffset, b.byteLength);
  const ssz = 1 << dv.getUint16(0x1E, true);
  const mssz = 1 << dv.getUint16(0x20, true);
  if (ssz !== 512 && ssz !== 4096) throw bookError('ملف Excel تالف.');
  const nFat = dv.getUint32(0x2C, true);
  const dirStart = dv.getUint32(0x30, true);
  const miniCutoff = dv.getUint32(0x38, true);
  const miniFatStart = dv.getUint32(0x3C, true);
  let difSec = dv.getUint32(0x44, true);
  const per = ssz / 4;
  const secOff = s => (s + 1) * ssz;
  const fatSecs = [];
  for (let i = 0; i < 109 && fatSecs.length < nFat; i++) fatSecs.push(dv.getUint32(0x4C + i * 4, true));
  let guard = 0;
  while (difSec < 0xFFFFFFFA && fatSecs.length < nFat && guard++ < 100000) {
    const off = secOff(difSec);
    if (off + ssz > b.length) break;
    for (let i = 0; i < per - 1 && fatSecs.length < nFat; i++) fatSecs.push(dv.getUint32(off + i * 4, true));
    difSec = dv.getUint32(off + (per - 1) * 4, true);
  }
  const fat = new Uint32Array(fatSecs.length * per);
  fatSecs.forEach((s, k) => {
    const off = secOff(s);
    for (let i = 0; i < per; i++) fat[k * per + i] = (off + i * 4 + 4 <= b.length) ? dv.getUint32(off + i * 4, true) : 0xFFFFFFFE;
  });
  const readChain = start => {
    const parts = [];
    let s = start, n = 0;
    while (s < 0xFFFFFFFA && s < fat.length && n++ <= fat.length) {
      const off = secOff(s);
      if (off + ssz > b.length) break;
      parts.push(b.subarray(off, off + ssz));
      s = fat[s];
    }
    return concatBytes(parts);
  };
  const dir = readChain(dirStart);
  const entries = [];
  for (let p = 0; p + 128 <= dir.length; p += 128) {
    const nl = dir[p + 0x40] | (dir[p + 0x41] << 8);
    const ddv = new DataView(dir.buffer, dir.byteOffset + p, 128);
    entries.push({
      name: nl > 2 && nl <= 64 ? utf16(dir.subarray(p, p + nl - 2)) : '',
      type: dir[p + 0x42], start: ddv.getUint32(0x74, true), size: ddv.getUint32(0x78, true)
    });
  }
  const root = entries[0];
  let miniStream = null, miniFat = null;
  const find = name => entries.find(e => e.type === 2 && e.name.toLowerCase() === name.toLowerCase());
  return {
    has: name => !!find(name),
    get(name) {
      const e = find(name);
      if (!e) return null;
      if (e.size < miniCutoff && root) {
        if (!miniStream) {
          miniStream = readChain(root.start);
          const mf = readChain(miniFatStart);
          miniFat = new Uint32Array(mf.buffer.slice(mf.byteOffset, mf.byteOffset + (mf.length & ~3)));
        }
        const parts = [];
        let s = e.start, got = 0, n = 0;
        while (s < 0xFFFFFFFA && got < e.size && n++ <= miniFat.length) {
          parts.push(miniStream.subarray(s * mssz, s * mssz + mssz));
          got += mssz;
          s = miniFat[s];
        }
        return concatBytes(parts).subarray(0, e.size);
      }
      return readChain(e.start).subarray(0, e.size);
    }
  };
}

/* ---------- XLS: سجلات BIFF8 ---------- */
function readXls(b) {
  const cfb = readCfb(b);
  if (cfb.has('EncryptionInfo') || cfb.has('EncryptedPackage')) throw bookError('الملف محمي بكلمة مرور. أزل الحماية في Excel ثم أعد المحاولة.');
  const wb = cfb.get('Workbook') || cfb.get('Book');
  if (!wb) {
    if (cfb.has('WordDocument')) throw bookError('هذا ملف Word وليس ملف Excel.');
    throw bookError('هذا الملف ليس ملف Excel صالحاً.');
  }
  return parseBiff(wb);
}
function xlString(d, o) {
  const cch = d[o] | (d[o + 1] << 8);
  return (d[o + 2] & 1) ? utf16(d.subarray(o + 3, o + 3 + cch * 2)) : latin1(d.subarray(o + 3, o + 3 + cch));
}
function rkValue(rk) {
  let v;
  if (rk & 2) v = (rk | 0) >> 2;
  else {
    const t = new DataView(new ArrayBuffer(8));
    t.setUint32(4, (rk & 0xFFFFFFFC) >>> 0, true);
    v = t.getFloat64(0, true);
  }
  return (rk & 1) ? v / 100 : v;
}
/* جدول النصوص المشتركة؛ قد تمتد النصوص عبر سجلات CONTINUE */
function parseSst(segs) {
  let k = 0, data = segs[0], pos = 8;
  const unique = new DataView(data.buffer, data.byteOffset, data.byteLength).getUint32(4, true);
  const out = [];
  for (let i = 0; i < unique; i++) {
    while (pos >= data.length && k + 1 < segs.length) { pos -= data.length; k++; data = segs[k]; }
    if (pos + 3 > data.length) break;
    const nchars = data[pos] | (data[pos + 1] << 8);
    let opts = data[pos + 2];
    pos += 3;
    let runs = 0, pho = 0;
    if (opts & 0x08) { runs = data[pos] | (data[pos + 1] << 8); pos += 2; }
    if (opts & 0x04) { pho = (data[pos] | (data[pos + 1] << 8) | (data[pos + 2] << 16) | (data[pos + 3] << 24)) >>> 0; pos += 4; }
    let s = '', got = 0;
    for (;;) {
      const need = nchars - got;
      let avail;
      if (opts & 1) { avail = Math.max(0, Math.min((data.length - pos) >> 1, need)); s += utf16(data.subarray(pos, pos + avail * 2)); pos += avail * 2; }
      else { avail = Math.max(0, Math.min(data.length - pos, need)); s += latin1(data.subarray(pos, pos + avail)); pos += avail; }
      got += avail;
      if (got >= nchars) break;
      if (k + 1 >= segs.length) break;
      k++; data = segs[k]; opts = data[0]; pos = 1;
    }
    for (let r = 0; r < runs; r++) {
      if (pos >= data.length && k + 1 < segs.length) { k++; data = segs[k]; pos = 0; }
      pos += 4;
    }
    pos += pho;
    out.push(s);
  }
  return out;
}
function parseBiff(d) {
  const dv = new DataView(d.buffer, d.byteOffset, d.byteLength);
  if (d.length < 8 || dv.getUint16(0, true) !== 0x0809) throw bookError('صيغة ملف Excel غير مدعومة.');
  if (dv.getUint16(4, true) !== 0x0600) throw bookError('هذا الملف بصيغة Excel قديمة جداً. افتحه في Excel واحفظه بصيغة ' + LTR('.xlsx') + ' ثم أعد المحاولة.');
  const metas = [];
  let sstSegs = null, lastMain = 0, p = 0;
  while (p + 4 <= d.length) {
    const type = dv.getUint16(p, true), len = dv.getUint16(p + 2, true);
    const o = p + 4;
    const data = d.subarray(o, o + len);
    if (type === 0x003C) { if (lastMain === 0x00FC && sstSegs) sstSegs.push(data); }
    else {
      lastMain = type;
      if (type === 0x002F) throw bookError('الملف محمي بكلمة مرور. أزل الحماية في Excel ثم أعد المحاولة.');
      if (type === 0x0085 && len >= 8) {
        const cch = data[6];
        metas.push({ pos: dv.getUint32(o, true), dt: data[5], name: (data[7] & 1) ? utf16(data.subarray(8, 8 + cch * 2)) : latin1(data.subarray(8, 8 + cch)) });
      } else if (type === 0x00FC) sstSegs = [data];
      else if (type === 0x000A) break;
    }
    p = o + len;
  }
  const shared = sstSegs ? parseSst(sstSegs) : [];
  const sheets = [];
  metas.forEach(sm => {
    if (sm.dt !== 0 || sm.pos + 4 > d.length) return;
    const rows = [];
    const put = (r, c, v) => {
      if (r >= XL_MAX_ROWS || c >= XL_MAX_COLS) return;
      v = String(v == null ? '' : v).trim();
      if (v) (rows[r] || (rows[r] = []))[c] = v;
    };
    let q = sm.pos, depth = 0, pending = null;
    while (q + 4 <= d.length) {
      const type = dv.getUint16(q, true), len = dv.getUint16(q + 2, true);
      const o = q + 4;
      if (o + len > d.length) break;
      if (type === 0x0809) depth++;
      else if (type === 0x000A) { depth--; if (depth <= 0) break; }
      else if (depth === 1) {
        const r = len >= 4 ? dv.getUint16(o, true) : 0, c = len >= 4 ? dv.getUint16(o + 2, true) : 0;
        if (type === 0x00FD && len >= 10) put(r, c, shared[dv.getUint32(o + 6, true)]);
        else if ((type === 0x0204 || type === 0x00D6) && len >= 9) put(r, c, xlString(d, o + 6));
        else if (type === 0x0203 && len >= 14) put(r, c, fmtCellNumber(dv.getFloat64(o + 6, true)));
        else if (type === 0x027E && len >= 10) put(r, c, fmtCellNumber(rkValue(dv.getUint32(o + 6, true))));
        else if (type === 0x00BD && len >= 6) {
          const n = Math.floor((len - 6) / 6);
          for (let k = 0; k < n; k++) put(r, c + k, fmtCellNumber(rkValue(dv.getUint32(o + 4 + k * 6 + 2, true))));
        } else if (type === 0x0006 && len >= 20) {
          if (d[o + 12] === 0xFF && d[o + 13] === 0xFF) {
            if (d[o + 6] === 0) pending = { r, c };
            else if (d[o + 6] === 1) put(r, c, d[o + 8] ? 'TRUE' : 'FALSE');
          } else put(r, c, fmtCellNumber(dv.getFloat64(o + 6, true)));
        } else if (type === 0x0207 && pending && len >= 3) { put(pending.r, pending.c, xlString(d, o)); pending = null; }
      }
      q = o + len;
    }
    sheets.push({ name: sm.name || ('الورقة ' + (sheets.length + 1)), rows: densify(rows) });
  });
  if (!sheets.length) throw bookError('لا توجد أوراق عمل في هذا الملف.');
  return { sheets };
}

/* ---------- Excel 2003 XML ---------- */
function readSpreadsheetML(text) {
  const doc = xmlDoc(text);
  const attr = (el, n) => el.getAttributeNS(NS_SS, n) || el.getAttribute('ss:' + n);
  const sheets = [];
  Array.prototype.forEach.call(byTag(doc, 'Worksheet'), (ws, k) => {
    const rows = [];
    let r = 0;
    Array.prototype.forEach.call(byTag(ws, 'Row'), re => {
      const ri = parseInt(attr(re, 'Index'), 10);
      if (ri > 0) r = ri - 1;
      const arr = [];
      let c = 0;
      Array.prototype.forEach.call(byTag(re, 'Cell'), ce => {
        const ci = parseInt(attr(ce, 'Index'), 10);
        if (ci > 0) c = ci - 1;
        const dEl = byTag(ce, 'Data')[0];
        if (c < XL_MAX_COLS) arr[c] = dEl ? dEl.textContent.trim() : '';
        const span = parseInt(attr(ce, 'MergeAcross'), 10);
        c += 1 + (span > 0 ? span : 0);
      });
      if (r < XL_MAX_ROWS) rows[r] = arr;
      r++;
    });
    sheets.push({ name: attr(ws, 'Name') || ('الورقة ' + (k + 1)), rows: densify(rows) });
  });
  if (!sheets.length) throw bookError('لا توجد أوراق عمل في هذا الملف.');
  return { sheets };
}

/* ---------- جداول HTML (تصدّرها بعض الأنظمة بامتداد xls) ---------- */
function readHtmlTables(text) {
  const doc = new DOMParser().parseFromString(text, 'text/html');
  const sheets = [];
  Array.prototype.forEach.call(doc.querySelectorAll('table'), tb => {
    if (tb.querySelector('table')) return;
    const rows = [];
    Array.prototype.forEach.call(tb.rows, tr => {
      if (rows.length >= XL_MAX_ROWS) return;
      const arr = [];
      Array.prototype.forEach.call(tr.cells, td => {
        arr.push(cleanText(td.textContent));
        for (let s = 1; s < Math.min(td.colSpan || 1, 50); s++) arr.push('');
      });
      rows.push(arr.slice(0, XL_MAX_COLS));
    });
    const dense = densify(rows);
    if (dense.some(r => r.some(Boolean))) sheets.push({ name: 'جدول ' + (sheets.length + 1), rows: dense });
  });
  if (!sheets.length) throw bookError('لم يُعثر على جدول بيانات داخل الملف.');
  return { sheets };
}

/* ---------- CSV والنص المفصول (ومنه ما يُنسخ من Excel ويُلصق) ---------- */
function parseDelimited(text) {
  const t = String(text || '').replace(/^﻿/, '').replace(/\r\n?/g, '\n');
  const sample = t.slice(0, 20000);
  const count = ch => sample.split(ch).length - 1;
  const delim = count('\t') ? '\t' : (count(';') > count(',') ? ';' : (count(',') ? ',' : null));
  const rows = [];
  if (!delim) {
    t.split('\n').slice(0, XL_MAX_ROWS).forEach(line => rows.push([line.trim()]));
    return densify(rows);
  }
  let row = [], cell = '', quoted = false;
  for (let i = 0; i < t.length; i++) {
    const ch = t[i];
    if (quoted) {
      if (ch === '"') { if (t[i + 1] === '"') { cell += '"'; i++; } else quoted = false; }
      else cell += ch;
    } else if (ch === '"' && !cell.trim()) { quoted = true; cell = ''; }
    else if (ch === delim) { row.push(cell.trim()); cell = ''; }
    else if (ch === '\n') {
      row.push(cell.trim()); rows.push(row.slice(0, XL_MAX_COLS)); row = []; cell = '';
      if (rows.length >= XL_MAX_ROWS) break;
    } else cell += ch;
  }
  if (cell || row.length) { row.push(cell.trim()); rows.push(row.slice(0, XL_MAX_COLS)); }
  return densify(rows);
}

function copyText(text) {
  const done = () => toast('نُسخ: ' + LTR(text), { type: 'success', duration: 2500 });
  const fail = () => toast('تعذّر النسخ تلقائياً؛ حدّد النص وانسخه يدوياً.', { type: 'warn' });
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, () => { if (fallbackCopy(text)) done(); else fail(); });
  } else if (fallbackCopy(text)) done();
  else fail();
}
function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.setAttribute('readonly', '');
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  ta.remove();
  return ok;
}
