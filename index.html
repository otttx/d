/* ============ الرموز اللونية والخطوط ============ */
:root{
  --font-ui:"Daftar Sans","IBM Plex Sans Arabic","Segoe UI",Tahoma,"Geeza Pro","Noto Sans Arabic",system-ui,sans-serif;
  --font-head:"Markazi Text","Daftar Sans","Sakkal Majalla","Traditional Arabic",serif;
  --paper:#ECF0F4; --sheet:#FFFFFF; --sheet-2:#F6F8FA; --sheet-3:#EDF1F5;
  --rule:#DDE3EA; --rule-strong:#C3CDD8;
  --ink:#17213A; --ink-2:#465169; --ink-3:#737E93;
  --brand:#24408E; --brand-hover:#1B3276; --brand-soft:#E7ECF8; --brand-soft-2:#D2DBF2; --on-brand:#FFFFFF;
  --ok:#1C7848; --ok-soft:#E1F2E8; --ok-line:#B4DBC4; --ok-fill:#2E9E62;
  --warn:#8F5800; --warn-soft:#FCEFD2; --warn-line:#ECCF8C; --warn-fill:#E5B21C;
  --bad:#B23129; --bad-soft:#FBE6E3; --bad-line:#EFBFB9; --bad-fill:#D2453A; --on-bad:#FFFFFF;
  --none:#6E788B; --none-soft:#EEF1F4;
  --marker:#F3CD3B; --marker-ink:#6A4C00; --marker-soft:#FFF4C7;
  --row-hover:#F8FAFC; --row-focus:#EEF2FB;
  --shadow-sm:0 1px 2px rgba(23,33,58,.06);
  --shadow:0 1px 2px rgba(23,33,58,.05),0 14px 34px -20px rgba(23,33,58,.25);
  --shadow-lg:0 28px 70px -18px rgba(12,18,36,.45);
  --ring:0 0 0 3px rgba(36,64,142,.22);
  --r-lg:16px; --r:12px; --r-sm:9px;
  --g-work:#E8EDF9; --g-work-ink:#2B3F86; --g-mid:#F3ECFA; --g-mid-ink:#5E3A93; --g-final:#E3F2EE; --g-final-ink:#145E51;
  --wc-line:rgba(36,64,142,.06);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --paper:#0D1320; --sheet:#141B2A; --sheet-2:#192133; --sheet-3:#1F293D;
  --rule:#273248; --rule-strong:#35425C;
  --ink:#E5E9F2; --ink-2:#AEB8CB; --ink-3:#8794AB;
  --brand:#91A9FF; --brand-hover:#A9BCFF; --brand-soft:#1D2849; --brand-soft-2:#283863; --on-brand:#0B1230;
  --ok:#5DCA8B; --ok-soft:#12301F; --ok-line:#1F4D33; --ok-fill:#4CB97C;
  --warn:#EFB651; --warn-soft:#33270E; --warn-line:#5B4517; --warn-fill:#D9A931;
  --bad:#F18C82; --bad-soft:#3A1917; --bad-line:#63302A; --bad-fill:#E0675C; --on-bad:#2A0A07;
  --none:#97A2B6; --none-soft:#222B3D;
  --marker:#E3BC32; --marker-ink:#F6D766; --marker-soft:#352D11;
  --row-hover:#182030; --row-focus:#1B2541;
  --shadow-sm:0 1px 2px rgba(0,0,0,.35);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 16px 40px -20px rgba(0,0,0,.7);
  --shadow-lg:0 30px 80px -20px rgba(0,0,0,.8);
  --ring:0 0 0 3px rgba(145,169,255,.28);
  --g-work:#1E2847; --g-work-ink:#AFC0FF; --g-mid:#2A2142; --g-mid-ink:#CDB4F2; --g-final:#13302A; --g-final-ink:#8FD6C6;
  --wc-line:rgba(145,169,255,.07);
  color-scheme:dark;
}

/* ============ الأساسيات ============ */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;font-family:var(--font-ui);font-size:15px;line-height:1.6;color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body.has-modal{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
::selection{background:var(--brand-soft-2)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.ico{width:18px;height:18px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
.muted{color:var(--ink-3)}

/* ============ الشريط العلوي ============ */
.app{max-width:1480px;margin:0 auto;padding:18px 20px 56px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px 20px;flex-wrap:wrap;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand-mark{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--brand);color:var(--on-brand);box-shadow:0 8px 18px -10px var(--brand)}
.brand-mark .ico{width:24px;height:24px;stroke-width:1.8}
.brand-title{margin:0;font-family:var(--font-head);font-weight:600;font-size:30px;line-height:1.05}
.brand-sub{margin:3px 0 0;font-size:12.5px;color:var(--ink-3)}
.top-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sys-status{display:flex;flex-direction:column;gap:1px;padding:2px 0 2px 14px;margin-inline-end:6px;border-inline-end:1px solid var(--rule);font-size:12px;color:var(--ink-3);line-height:1.55}
.ss-line{display:flex;align-items:center;gap:6px;white-space:nowrap}
.ss-dot{width:7px;height:7px;border-radius:50%;background:var(--ok-fill);flex:0 0 auto}
.ss-dot.bad{background:var(--bad-fill)}
.ss-warn{color:var(--warn);font-weight:600}
.ss-bad{color:var(--bad);font-weight:600}

/* ============ الأزرار ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 14px;border-radius:var(--r-sm);border:1px solid transparent;background:transparent;font-size:14px;font-weight:600;line-height:1;white-space:nowrap;user-select:none;transition:background-color .15s,border-color .15s,color .15s,box-shadow .15s}
.btn:focus-visible{outline:none;box-shadow:var(--ring)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-sm{height:32px;padding:0 11px;font-size:13px;border-radius:8px}
.btn-sm .ico{width:16px;height:16px}
.btn-primary{background:var(--brand);color:var(--on-brand)}
.btn-primary:not(:disabled):hover{background:var(--brand-hover)}
.btn-line{background:var(--sheet);border-color:var(--rule-strong);color:var(--ink)}
.btn-line:not(:disabled):hover{background:var(--sheet-2);border-color:var(--ink-3)}
.btn-line .ico{color:var(--ink-2)}
.btn-ghost{color:var(--ink-2)}
.btn-ghost:not(:disabled):hover{background:var(--sheet-3);color:var(--ink)}
.btn-danger{background:var(--bad);color:var(--on-bad)}
.btn-danger:not(:disabled):hover{filter:brightness(.93)}
.btn-danger-line{background:var(--bad-soft);border-color:var(--bad-line);color:var(--bad)}
.btn-danger-line:not(:disabled):hover{border-color:var(--bad)}
.btn-danger-text,.btn-danger-text .ico{color:var(--bad)}
.btn-danger-text:not(:disabled):hover{background:var(--bad-soft);border-color:var(--bad-line)}
.icon-btn{width:38px;height:38px;display:inline-grid;place-items:center;border-radius:var(--r-sm);border:1px solid var(--rule-strong);background:var(--sheet);color:var(--ink-2);transition:background-color .15s,color .15s}
.icon-btn:hover{background:var(--sheet-2);color:var(--ink)}
.icon-btn-sm{width:32px;height:32px;border-color:transparent;background:transparent}
.link-btn{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;padding:0;border:0;background:none;color:var(--brand);font-size:13.5px;font-weight:600;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.link-btn .ico{width:16px;height:16px}
.push-end{margin-inline-start:auto}

/* ============ تنبيه التخزين ============ */
.banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;margin-bottom:12px;border-radius:var(--r);background:var(--bad-soft);border:1px solid var(--bad-line);color:var(--bad);font-weight:600;font-size:14px}
.banner .btn{margin-inline-start:auto}

/* ============ تبويبات المواد (فواصل الدفتر) ============ */
.binder{position:relative;display:flex;align-items:flex-end;gap:8px;padding:0 16px;margin-bottom:-1px;min-height:46px}
.tabs{display:flex;align-items:flex-end;gap:5px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;min-width:0;padding-top:8px}
.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-start;min-width:136px;max-width:260px;padding:8px 16px 10px;border:1px solid var(--rule);border-bottom:0;border-radius:12px 12px 0 0;background:var(--sheet-3);color:var(--ink-2);text-align:start;transform:translateY(5px);transition:transform .15s ease,background-color .15s,color .15s}
.tab:hover{transform:translateY(2px);background:var(--sheet-2);color:var(--ink)}
.tab[aria-selected="true"]{z-index:2;transform:none;background:var(--sheet);color:var(--ink)}
.tab[aria-selected="true"]::before{content:"";position:absolute;top:-1px;right:-1px;left:-1px;height:3px;border-radius:12px 12px 0 0;background:var(--brand)}
.tab:focus-visible{outline:none;box-shadow:var(--ring)}
.tab-name{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tab-sub{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tab[aria-selected="true"] .tab-sub{color:var(--brand)}
.tab-add{flex:0 0 auto;align-self:center;display:inline-flex;align-items:center;gap:6px;height:34px;margin-top:8px;padding:0 12px;border-radius:9px;border:1px dashed var(--rule-strong);background:transparent;color:var(--ink-2);font-size:13.5px;font-weight:600}
.tab-add:hover{border-style:solid;border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}
.sheet{position:relative;z-index:1;display:block;min-height:320px;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r-lg);box-shadow:var(--shadow)}

/* ============ رأس المادة ============ */
.sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px 24px;flex-wrap:wrap;padding:22px 24px 16px}
.course-id{display:flex;align-items:center;gap:16px;min-width:0}
.code-stamp{flex:0 0 auto;display:grid;place-items:center;min-width:78px;min-height:56px;padding:6px 14px;border:1.5px solid var(--brand);border-radius:10px;color:var(--brand);background:var(--brand-soft);box-shadow:inset 0 0 0 2px var(--sheet),inset 0 0 0 3px var(--brand-soft-2)}
.code-stamp span{font-family:var(--font-head);font-weight:600;font-size:23px;line-height:1.1;white-space:nowrap}
.course-name{margin:0;font-family:var(--font-head);font-weight:600;font-size:34px;line-height:1.15;color:var(--ink);overflow-wrap:anywhere}
.course-facts{display:flex;flex-wrap:wrap;align-items:center;gap:4px 0;margin-top:6px;font-size:13px;color:var(--ink-3)}
.course-facts>span{padding:0 12px;border-inline-start:1px solid var(--rule)}
.course-facts>span:first-child{padding-inline-start:0;border:0}
.course-facts b{color:var(--ink);font-weight:600}
.course-actions{display:flex;gap:8px;flex-wrap:wrap}

/* ============ الشريط الإحصائي ============ */
.summary{display:grid;grid-template-columns:auto minmax(0,1fr) auto;margin:0 24px 18px;border:1px solid var(--rule);border-radius:var(--r);background:var(--sheet-2)}
.sum-block{display:flex;flex-direction:column;justify-content:center;gap:2px;padding:12px 20px;min-width:0}
.sum-block+.sum-block{border-inline-start:1px solid var(--rule)}
.sum-num{font-size:28px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--ink)}
.sum-num small{font-size:14px;font-weight:600;color:var(--ink-3)}
.sum-lbl{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.sum-note{font-size:12px;color:var(--ink-3)}
.sum-note.is-warn{color:var(--bad);font-weight:600}
.sum-note.is-ok{color:var(--ok);font-weight:600}
.sum-break{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:12px;color:var(--ink-2)}
.sum-break b{color:var(--ink);font-variant-numeric:tabular-nums}
.dist-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:7px}
.leg-hint{font-size:12px;color:var(--ink-3)}
.dist-bar{display:flex;gap:3px;height:12px;border-radius:99px;overflow:hidden;background:var(--sheet-3)}
.dist-bar.is-empty{background:repeating-linear-gradient(-45deg,var(--sheet-3) 0 6px,var(--rule) 6px 7px)}
.dist-bar i{display:block;height:100%;min-width:0;flex-basis:0;transition:flex-grow .3s ease}
.d-complete{background:var(--ok-fill)}.d-partial{background:var(--warn-fill)}.d-zero{background:var(--bad-fill)}.d-none{background:var(--rule-strong)}
.dist-legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.leg{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 12px;border-radius:99px;border:1px solid var(--rule);background:var(--sheet);font-size:13px;font-weight:600;color:var(--ink-2);transition:border-color .15s,background-color .15s,color .15s}
.leg b{color:var(--ink);font-variant-numeric:tabular-nums}
.leg .sw{width:10px;height:10px;border-radius:3px}
.leg:hover{border-color:var(--ink-3)}
.leg-complete .sw{background:var(--ok-fill)}.leg-partial .sw{background:var(--warn-fill)}.leg-zero .sw{background:var(--bad-fill)}
.leg-complete.is-active{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.leg-partial.is-active{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.leg-zero.is-active{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.leg.is-active b{color:inherit}

/* ============ شريط الأدوات ============ */
.toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:10px;padding:12px 24px}
.search{position:relative;flex:1 1 240px;max-width:360px}
.search>.ico{position:absolute;top:50%;right:12px;transform:translateY(-50%);width:17px;height:17px;color:var(--ink-3);pointer-events:none}
.search input{width:100%;height:38px;padding:0 38px 0 36px;border-radius:var(--r-sm);border:1px solid var(--rule-strong);background:var(--sheet);font-size:14px}
.search input:focus{outline:none;border-color:var(--brand);box-shadow:var(--ring)}
.search input::placeholder{color:var(--ink-3)}
.search-clear{position:absolute;top:50%;left:6px;transform:translateY(-50%);width:26px;height:26px;display:grid;place-items:center;border:0;border-radius:6px;background:transparent;color:var(--ink-3)}
.search-clear:hover{background:var(--sheet-3);color:var(--ink)}
.search-clear .ico{width:15px;height:15px}
.toolbar-actions{display:flex;gap:8px;flex-wrap:wrap;margin-inline-start:auto}
.filter-chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 11px;border-radius:99px;border:1px solid;font-size:13px;font-weight:600}
.filter-chip .ico{width:15px;height:15px}

/* ============ جدول الرصد ============ */
.table-wrap{position:relative;overflow:auto;max-height:max(440px,calc(100vh - 150px));border-top:1px solid var(--rule);border-radius:0 0 var(--r-lg) var(--r-lg);scroll-padding:84px 286px 64px 116px}
.grid{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}
.grid th,.grid td{padding:0;background:var(--sheet);border-bottom:1px solid var(--rule);font-weight:inherit;text-align:center;vertical-align:middle}
.grid thead th{position:sticky;top:0;z-index:3;background:var(--sheet-2);border-bottom:1px solid var(--rule-strong);font-weight:600;color:var(--ink-2);vertical-align:bottom}
.grid .col-name{position:sticky;right:0;z-index:2;width:282px;min-width:282px;text-align:start;border-inline-end:1px solid var(--rule)}
.grid .col-total{position:sticky;left:0;z-index:2;width:112px;min-width:112px;border-inline-start:1px solid var(--rule)}
.grid thead .col-name,.grid thead .col-total{z-index:5}
.grid tfoot th,.grid tfoot td{position:sticky;bottom:0;z-index:3;background:var(--sheet-2);border-top:1px solid var(--rule-strong);border-bottom:0}
.grid tfoot .col-name,.grid tfoot .col-total{z-index:5}
.grid tbody tr:hover>*{background:var(--row-hover)}
.grid tbody tr:focus-within>*{background:var(--row-focus)}
.grid tbody tr:last-child>*{border-bottom:0}
.th-name{display:flex;align-items:flex-end;gap:8px;padding:10px 16px;font-size:13px;color:var(--ink)}
.th-count{font-size:12px;color:var(--ink-3);font-weight:600}
.th-task{min-width:90px;width:94px}
.th-btn{display:flex;flex-direction:column;align-items:center;gap:4px;width:100%;min-height:76px;padding:9px 5px 8px;border:0;background:transparent;color:inherit;text-align:center}
.th-btn:hover{background:var(--sheet-3)}
.th-btn:focus-visible{outline:none;box-shadow:inset 0 0 0 2px var(--brand)}
.th-title{font-size:13px;font-weight:700;line-height:1.35;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.th-meta{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:4px 6px;margin-top:auto}
.th-max{font-size:12px;font-weight:600;color:var(--ink-3);font-variant-numeric:tabular-nums}
.th-off{font-size:11px;line-height:18px;padding:0 5px;border:1px dashed var(--rule-strong);border-radius:5px;color:var(--ink-3)}
.th-task.is-off .th-title{color:var(--ink-3)}
.th-total{display:flex;flex-direction:column;align-items:center;gap:1px;padding:10px 8px;font-size:13px;color:var(--ink)}
.th-total span{font-size:12px;color:var(--ink-3);font-weight:600}
.th-empty{padding:10px 14px!important;min-width:260px;vertical-align:middle!important}
.type-chip{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:5px;font-size:11.5px;font-weight:600;white-space:nowrap}
.tone-indigo{background:#E8ECFA;color:#33429A}.tone-teal{background:#DDF1EE;color:#0E6A61}.tone-sky{background:#E1EFF9;color:#1B5E8C}
.tone-violet{background:#EFE8F9;color:#673F9C}.tone-orange{background:#FBE9DA;color:#9E4D17}.tone-slate{background:#ECEFF3;color:#4A5466}
:root[data-theme="dark"] .tone-indigo{background:#232D52;color:#AFBBF6}
:root[data-theme="dark"] .tone-teal{background:#123532;color:#7FD5C9}
:root[data-theme="dark"] .tone-sky{background:#14304A;color:#8CC4EE}
:root[data-theme="dark"] .tone-violet{background:#2E2448;color:#C6AAF0}
:root[data-theme="dark"] .tone-orange{background:#3A2616;color:#F0B285}
:root[data-theme="dark"] .tone-slate{background:#262E3D;color:#B4BDCC}
.tone-plum{background:#F5E6F0;color:#8A2D63}.tone-navy{background:#E2E8F5;color:#1F3366}
:root[data-theme="dark"] .tone-plum{background:#3A1E31;color:#F0A9D0}
:root[data-theme="dark"] .tone-navy{background:#1C2A4A;color:#A9BCF2}
/* مجموعات الأعمدة: الأعمال، الفصلي، النهائي */
.grid.is-banded thead tr.band-row th{top:0}
.grid.is-banded thead tr.cols-row th{top:40px}
.grid thead th.band{height:40px;padding:0 12px;text-align:center;vertical-align:middle;white-space:nowrap;font-size:13px;font-weight:700;border-bottom:1px solid var(--rule)}
.band-name{margin-inline-end:8px}
.band-max{font-size:11.5px;font-weight:600;opacity:.75;font-variant-numeric:tabular-nums}
.grid thead th.band-work{background:var(--g-work);color:var(--g-work-ink)}
.grid thead th.band-midterm{background:var(--g-mid);color:var(--g-mid-ink)}
.grid thead th.band-final{background:var(--g-final);color:var(--g-final-ink)}
.grid .sep{border-inline-start:2px solid var(--rule-strong)}
.grid thead th.th-sub{min-width:90px;width:94px;background:var(--sheet-3);vertical-align:bottom}
.grid tbody .sub-cell{min-width:90px;padding:6px 8px;background:var(--sheet-2)}
.sub-val{display:block;font-size:15px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums;color:var(--ink)}
.sub-of{font-size:11.5px;color:var(--ink-3)}
.table-wrap:has(.is-banded){scroll-padding-top:124px}

/* خلية الاسم */
.name-cell{display:flex;align-items:center;gap:8px;min-height:54px;padding:7px 12px 7px 6px;box-shadow:inset -4px 0 0 var(--mark,transparent)}
tr.row-complete .name-cell{--mark:var(--ok-fill)}
tr.row-partial .name-cell{--mark:var(--warn-fill)}
tr.row-zero .name-cell{--mark:var(--bad-fill)}
tr.row-none .name-cell{--mark:var(--rule-strong)}
.row-no{flex:0 0 auto;min-width:18px;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums;text-align:center}
.name-main{flex:1 1 auto;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px}
.student-name{font-weight:600;color:var(--ink);line-height:1.45;overflow-wrap:anywhere}
.status-pill{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 7px 0 8px;border-radius:99px;border:1px solid;font-size:12px;font-weight:700;line-height:1;white-space:nowrap;font-variant-numeric:tabular-nums}
.status-pill .ico{width:13px;height:13px;stroke-width:2.6}
.st-complete{color:var(--ok);background:var(--ok-soft);border-color:var(--ok-line)}
.st-partial{color:var(--warn);background:var(--warn-soft);border-color:var(--warn-line)}
.st-zero{color:var(--bad);background:var(--bad-soft);border-color:var(--bad-line)}
.st-none{color:var(--none);background:var(--none-soft);border-color:var(--rule)}
.row-actions{display:flex;align-items:center;gap:0;flex:0 0 auto}
.ra{position:relative;width:27px;height:28px;display:grid;place-items:center;border:0;border-radius:8px;background:transparent;color:var(--ink-3);opacity:.6;transition:opacity .15s,background-color .15s,color .15s}
.ra .ico{width:16px;height:16px}
tr:hover .ra,tr:focus-within .ra,.ra:focus-visible{opacity:1}
.ra:hover{background:var(--sheet-3);color:var(--ink)}
.ra.danger:hover{background:var(--bad-soft);color:var(--bad)}
.ra.has-notes{opacity:1;color:var(--marker-ink);background:var(--marker-soft)}
.ra.has-notes:hover{background:var(--marker);color:#3B2A00}
.ra .badge{position:absolute;top:-4px;left:-4px;min-width:16px;height:16px;padding:0 4px;border-radius:99px;background:var(--marker);color:#3B2A00;font-size:10px;font-weight:700;line-height:16px;text-align:center;box-shadow:0 0 0 2px var(--sheet)}
@media (hover:none){.ra{opacity:1}}

/* خلايا الدرجات */
.g-cell{position:relative;padding:6px 6px!important}
.g-input{width:58px;height:36px;padding:0 6px;border:1px solid var(--rule);border-radius:8px;background:var(--sheet-2);text-align:center;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;direction:ltr;transition:border-color .12s,box-shadow .12s,background-color .12s}
.g-input::placeholder{color:var(--rule-strong);font-weight:400}
.g-input:hover{border-color:var(--rule-strong)}
.g-input:focus{outline:none;border-color:var(--brand);background:var(--sheet);box-shadow:var(--ring)}
.g-input.filled{background:var(--sheet);border-color:var(--rule-strong)}
.g-input.is-invalid{border-color:var(--bad);background:var(--bad-soft);color:var(--bad);box-shadow:0 0 0 3px color-mix(in srgb,var(--bad) 22%,transparent)}
.g-cell.is-off .g-input{border-style:dashed}
.g-err{position:absolute;top:calc(100% - 6px);left:50%;transform:translateX(-50%);z-index:6;padding:3px 8px;border-radius:6px;background:var(--bad);color:var(--on-bad);font-size:11.5px;font-weight:600;white-space:nowrap;pointer-events:none;box-shadow:var(--shadow)}
.g-empty{color:var(--ink-3);min-width:260px}
.total{display:flex;align-items:baseline;justify-content:center;gap:5px;padding:0 12px}
.total-val{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink)}
.total-of{font-size:12px;color:var(--ink-3)}
.total-bar{height:4px;margin:5px 18px 0;border-radius:99px;background:var(--sheet-3);overflow:hidden}
.total-bar i{display:block;height:100%;border-radius:inherit;background:var(--brand);transition:width .25s ease}
.foot-label{display:flex;flex-direction:column;padding:8px 16px;font-size:12.5px;font-weight:700;color:var(--ink-2);line-height:1.4;text-align:start}
.foot-label span{font-weight:400;font-size:11.5px;color:var(--ink-3)}
.foot-cell{padding:7px 6px!important;font-size:11.5px;color:var(--ink-3);line-height:1.35}
.foot-cell b{display:block;font-size:14px;color:var(--ink);font-variant-numeric:tabular-nums}
.no-results td{padding:30px 16px!important;color:var(--ink-3);text-align:center}
@keyframes flash{from{background:var(--marker-soft)}to{background:var(--sheet)}}
tr.flash>*{animation:flash 1.8s ease}

/* ============ الحالات الفارغة ============ */
.empty{padding:44px 24px 50px;text-align:center;color:var(--ink-2)}
.empty-ico{width:62px;height:62px;margin:0 auto 14px;border-radius:17px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand)}
.empty-ico .ico{width:28px;height:28px;stroke-width:1.7}
.empty h3{margin:0 0 6px;font-family:var(--font-head);font-weight:600;font-size:27px;line-height:1.25;color:var(--ink)}
.empty p{margin:0 auto 18px;max-width:480px;font-size:14.5px}
.empty-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.welcome{padding:56px 24px 60px;display:grid;place-items:center}
.welcome-inner{max-width:640px;text-align:center}
.welcome h2{margin:0 0 8px;font-family:var(--font-head);font-weight:600;font-size:42px;line-height:1.15}
.welcome p{margin:0 auto 22px;color:var(--ink-2);font-size:15.5px;max-width:520px}
.steps{list-style:none;margin:34px 0 0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--rule);border-radius:var(--r);text-align:start;counter-reset:s}
.steps li{padding:14px 16px;counter-increment:s;font-size:13.5px;color:var(--ink-2)}
.steps li+li{border-inline-start:1px solid var(--rule)}
.steps li::before{content:counter(s);display:grid;place-items:center;width:24px;height:24px;margin-bottom:8px;border-radius:50%;background:var(--brand-soft);color:var(--brand);font-weight:700;font-size:13px}
.steps b{display:block;margin-bottom:2px;color:var(--ink);font-size:14px}

/* ============ النوافذ المنبثقة ============ */
.modal-back{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(10,15,30,.46);opacity:0;transition:opacity .16s ease}
.modal-back.open{opacity:1}
.modal{display:flex;flex-direction:column;width:100%;max-width:480px;max-height:calc(100vh - 40px);max-height:calc(100dvh - 40px);background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);transform:translateY(10px) scale(.985);transition:transform .18s ease}
.modal-back.open .modal{transform:none}
.modal-md{max-width:640px}.modal-lg{max-width:1000px}
.modal-head{display:flex;align-items:center;gap:12px;padding:18px 20px 10px}
.modal-ico{width:36px;height:36px;flex:0 0 auto;border-radius:10px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand)}
.modal-danger .modal-ico{background:var(--bad-soft);color:var(--bad)}
.modal-head h2{flex:1;margin:0;font-size:18px;font-weight:700;line-height:1.35}
.modal-body{padding:6px 20px 18px;overflow:auto;overscroll-behavior:contain}
.modal-foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:14px 20px;border-top:1px solid var(--rule);background:var(--sheet-2);border-radius:0 0 var(--r-lg) var(--r-lg)}
.dialog-text{margin:0 0 6px;font-size:14.5px;color:var(--ink-2);line-height:1.8}
.dialog-text b{color:var(--ink)}

/* النماذج */
.form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.label{font-size:13px;font-weight:600;color:var(--ink-2)}
.req{color:var(--bad);font-weight:700}
.field input[type="text"],.field select,.field textarea,.composer textarea,.note-edit{width:100%;min-height:42px;padding:9px 12px;border-radius:var(--r-sm);border:1px solid var(--rule-strong);background:var(--sheet);font-size:14.5px;line-height:1.5;transition:border-color .15s,box-shadow .15s}
.field select{height:42px;padding-block:0}
.field textarea,.composer textarea,.note-edit{resize:vertical;line-height:1.8}
.field input:focus,.field select:focus,.field textarea:focus,.composer textarea:focus,.note-edit:focus{outline:none;border-color:var(--brand);box-shadow:var(--ring)}
.field input::placeholder,.field textarea::placeholder,.composer textarea::placeholder{color:var(--ink-3);opacity:.8}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint{font-size:12.5px;color:var(--ink-3);line-height:1.6}
.hint.is-warn{color:var(--warn);font-weight:600}
.hint:empty{display:none}
.form-error{padding:10px 12px;border-radius:var(--r-sm);background:var(--bad-soft);border:1px solid var(--bad-line);color:var(--bad);font-size:13.5px;font-weight:600}
.form-note{padding:9px 12px;border-radius:var(--r-sm);background:var(--sheet-3);color:var(--ink-2);font-size:13px}
.form-note.is-warn{background:var(--warn-soft);color:var(--warn);font-weight:600}
.form-actions{display:flex;gap:8px;flex-wrap:wrap}
.check{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border:1px solid var(--rule);border-radius:var(--r-sm);background:var(--sheet);cursor:pointer}
.check input{width:18px;height:18px;margin:2px 0 0;flex:0 0 auto;accent-color:var(--brand)}
.check b{display:block;font-size:14px;font-weight:600}
.check .hint{display:block;margin-top:2px}
.callout{display:flex;gap:10px;align-items:flex-start;margin-top:12px;padding:12px 14px;border-radius:var(--r);border:1px solid var(--rule);background:var(--sheet-2);font-size:13.5px;color:var(--ink-2);line-height:1.7}
.callout .ico{margin-top:3px;color:var(--brand)}
.callout b{color:var(--ink)}
.callout.warn{background:var(--warn-soft);border-color:var(--warn-line)}
.callout.warn .ico{color:var(--warn)}
.callout.bad{background:var(--bad-soft);border-color:var(--bad-line);color:var(--bad);font-weight:600}
.callout.bad .ico{color:var(--bad)}
.pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:99px;background:var(--sheet-3);color:var(--ink-2);font-size:12.5px;font-weight:600;white-space:nowrap}
.pill b{color:inherit;font-weight:700}
.pill .ico{width:14px;height:14px}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}

/* خيارات الحذف */
.choices{display:flex;flex-direction:column;gap:10px}
.choice{border:1px solid var(--rule);border-radius:var(--r);background:var(--sheet);transition:border-color .15s,background-color .15s}
.choice-main{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;cursor:pointer}
.choice-main input,.sub input{width:18px;height:18px;margin:3px 0 0;flex:0 0 auto;accent-color:var(--brand)}
.choice-title{display:block;font-weight:700;font-size:14.5px}
.choice-desc{display:block;font-size:13px;color:var(--ink-3)}
.choice:has(.choice-main input:checked){border-color:var(--brand);background:var(--brand-soft)}
.choice.is-danger:has(.choice-main input:checked){border-color:var(--bad);background:var(--bad-soft)}
.choice.is-danger .choice-main input{accent-color:var(--bad)}
.sub-choices{display:flex;flex-direction:column;gap:2px;padding:0 44px 12px 14px}
.sub{display:flex;gap:10px;align-items:flex-start;padding:7px 10px;border-radius:8px;cursor:pointer;font-size:13.5px}
.sub:hover{background:var(--sheet-3)}
.sub b{display:block;font-weight:600}
.sub .muted{display:block;font-size:12.5px}
.choice.is-off .sub-choices{opacity:.45}
.confirm-all{margin:0 14px 14px}

/* إدارة التكاليف */
.tm{display:grid;grid-template-columns:minmax(0,370px) minmax(0,1fr);gap:20px;align-items:start;margin-top:10px}
.tm-form{padding:16px;border:1px solid var(--rule);border-radius:var(--r);background:var(--sheet-2)}
.tm-form h3{margin:0 0 12px;font-size:15px;font-weight:700;overflow-wrap:anywhere}
.tm-summary{padding:10px 12px;margin-bottom:12px;border-radius:var(--r-sm);background:var(--sheet-2);border:1px solid var(--rule);font-size:13.5px;color:var(--ink-2)}
.tm-sum-line{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.tm-sum-groups{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.gchip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:6px;font-size:12px;font-weight:600}
.gchip.g-work{background:var(--g-work);color:var(--g-work-ink)}.gchip.g-midterm{background:var(--g-mid);color:var(--g-mid-ink)}.gchip.g-final{background:var(--g-final);color:var(--g-final-ink)}
.tm-group+.tm-group{margin-top:16px}
.tm-ghead{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:13.5px}
.tm-ghead .muted{margin-inline-start:auto;font-size:12.5px;font-weight:600}
.gdot{width:10px;height:10px;border-radius:3px;flex:0 0 auto}
.gdot.g-work{background:var(--g-work-ink)}.gdot.g-midterm{background:var(--g-mid-ink)}.gdot.g-final{background:var(--g-final-ink)}
.quick-add{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin:-2px 0 14px;font-size:13px}
.chip-btn{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 11px;border-radius:99px;border:1px dashed var(--rule-strong);background:var(--sheet);color:var(--ink-2);font-size:12.5px;font-weight:600}
.chip-btn:hover{border-style:solid;border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}
.chip-btn .ico{width:14px;height:14px}
.tm-summary b{color:var(--ink);font-variant-numeric:tabular-nums}
.tm-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;counter-reset:tk}
.tm-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--rule);border-radius:var(--r);background:var(--sheet);counter-increment:tk}
.tm-item.is-editing{border-color:var(--brand);box-shadow:var(--ring)}
.tm-item.is-off{background:var(--sheet-2)}
.tm-order{display:flex;flex-direction:column;gap:2px}
.tm-move{width:26px;height:22px;display:grid;place-items:center;border:1px solid var(--rule);border-radius:6px;background:var(--sheet);color:var(--ink-2)}
.tm-move:hover:not(:disabled){border-color:var(--brand);color:var(--brand)}
.tm-move:disabled{opacity:.35;cursor:default}
.tm-move .ico{width:14px;height:14px}
.tm-info{flex:1;min-width:0}
.tm-title{font-weight:700;font-size:14.5px;overflow-wrap:anywhere}
.tm-title::before{content:counter(tk) ". ";color:var(--ink-3);font-weight:600}
.tm-meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;margin-top:4px;font-size:12.5px;color:var(--ink-2)}
.tm-actions{display:flex;gap:4px;flex-wrap:wrap}
.tm-empty{padding:30px 16px;text-align:center;color:var(--ink-3);border:1px dashed var(--rule-strong);border-radius:var(--r)}

/* الملاحظات */
.notes-who{display:flex;flex-direction:column;margin-bottom:12px}
.notes-who b{font-size:16px}
.notes-who span{font-size:13px;color:var(--ink-3)}
.composer{padding:12px;border:1px solid var(--rule);border-radius:var(--r);background:var(--sheet-2)}
.composer-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:8px}
.notes-wrap{margin-top:16px}
.notes-count{margin-bottom:8px;font-size:12.5px;font-weight:600;color:var(--ink-3)}
.notes-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.note-item{padding:10px 14px 12px;border:1px solid var(--rule);border-radius:var(--r);background:var(--sheet);box-shadow:inset -3px 0 0 var(--marker)}
.note-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:var(--ink-3)}
.note-date{display:inline-flex;align-items:center;gap:5px;flex-wrap:wrap}
.note-date .ico{width:13px;height:13px}
.note-date em{font-style:normal;opacity:.85}
.note-actions{display:flex;gap:2px}
.note-actions .ra{opacity:1}
.note-text{margin-top:4px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14.5px;line-height:1.85}
.note-edit{margin-top:6px}
.note-edit-actions{display:flex;gap:6px;margin-top:8px}
.notes-empty{padding:22px;text-align:center;color:var(--ink-3);border:1px dashed var(--rule-strong);border-radius:var(--r);font-size:14px}

/* استيراد الأسماء */
.imp-source{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 0 12px}
.imp-file{font-size:13px;color:var(--ink-3);overflow-wrap:anywhere}
.imp-stats{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.imp-details{margin-top:8px;border:1px solid var(--rule);border-radius:var(--r-sm);background:var(--sheet-2)}
.imp-details summary{cursor:pointer;padding:8px 12px;font-size:13px;font-weight:600;color:var(--ink-2)}
.imp-list{margin:0;padding:4px 34px 10px 12px;max-height:180px;overflow:auto;font-size:13.5px;columns:2;column-gap:24px}
.imp-list li{break-inside:avoid;padding:1px 0}

/* استيراد من Excel */
.modal-wide{max-width:800px}
.seg{display:inline-flex;gap:2px;padding:3px;margin:8px 0 12px;border-radius:10px;background:var(--sheet-3);border:1px solid var(--rule)}
.seg-btn{height:32px;padding:0 14px;border:0;border-radius:8px;background:transparent;color:var(--ink-2);font-size:13.5px;font-weight:600}
.seg-btn:hover{color:var(--ink)}
.seg-btn.is-on{background:var(--sheet);color:var(--ink);box-shadow:var(--shadow-sm)}
.seg-btn:focus-visible{outline:none;box-shadow:var(--ring)}
.dropzone{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:28px 16px;border:1.5px dashed var(--rule-strong);border-radius:var(--r);background:var(--sheet-2);text-align:center;cursor:pointer;color:var(--ink-2);transition:border-color .15s,background-color .15s}
.dropzone:hover,.dropzone.is-over{border-color:var(--brand);background:var(--brand-soft)}
.dropzone:focus-visible{outline:none;box-shadow:var(--ring)}
.dropzone .ico{width:30px;height:30px;stroke-width:1.6;color:var(--brand);margin-bottom:4px}
.dropzone b{font-size:15px;color:var(--ink)}
.file-chip{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--rule);border-radius:var(--r-sm);background:var(--sheet-2);font-size:13.5px}
.file-chip>.ico{color:var(--ok)}
.file-chip b{flex:1;min-width:0;font-weight:600;overflow-wrap:anywhere}
.xl-bar{display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap;margin:14px 0 8px;font-size:13.5px;color:var(--ink-2)}
.xl-bar b{color:var(--ink)}
.xl-cols{display:inline-flex;align-items:center;flex-wrap:wrap;gap:6px}
.xl-tag{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px;border-radius:7px;background:var(--brand-soft);color:var(--ink);font-weight:600;unicode-bidi:isolate}
.xl-tag b{color:var(--brand);font-weight:700}
.xl-plus{color:var(--ink-3);font-weight:700}
.xl-sheet{display:inline-flex;align-items:center;gap:8px;font-weight:600}
.xl-sheet select{height:34px;padding:0 10px;border-radius:8px;border:1px solid var(--rule-strong);background:var(--sheet);font-size:13.5px}
.xl-preview{overflow:auto;max-height:240px;border:1px solid var(--rule);border-radius:var(--r-sm)}
.xl-preview table{min-width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px}
.xl-preview th,.xl-preview td{max-width:230px;padding:5px 10px;border-bottom:1px solid var(--rule);border-inline-start:1px solid var(--rule);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:start;background:var(--sheet)}
.xl-preview thead th{position:sticky;top:0;z-index:1;padding:4px;background:var(--sheet-2)}
.xl-preview tr:last-child td{border-bottom:0}
.xl-preview .xl-rn{width:38px;color:var(--ink-3);text-align:center;font-variant-numeric:tabular-nums;background:var(--sheet-2);border-inline-start:0}
.xl-col{width:100%;min-width:46px;height:28px;border:1px solid var(--rule);border-radius:7px;background:var(--sheet);color:var(--ink-2);font-size:12.5px;font-weight:700}
.xl-col:hover{border-color:var(--brand);color:var(--brand)}
.xl-col.is-on{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.xl-preview td.is-on{background:var(--brand-soft);color:var(--ink);font-weight:600}
.xl-preview tr.is-head td{color:var(--ink-3);background:var(--sheet-2)}
.xl-preview tr.is-head td.is-on{background:var(--brand-soft-2);color:var(--ink)}
.xl-foot{display:flex;align-items:center;justify-content:space-between;gap:8px 16px;flex-wrap:wrap;margin-top:8px}
.check-inline{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer}
.check-inline input{width:16px;height:16px;accent-color:var(--brand)}
.nm-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:14px 0 6px;font-size:13.5px}
.nm-head b{margin-inline-end:auto}
.nm-list{list-style:none;margin:0;padding:6px;display:grid;grid-template-columns:1fr 1fr;gap:1px 12px;max-height:250px;overflow:auto;border:1px solid var(--rule);border-radius:var(--r-sm);background:var(--sheet-2)}
.nm-list label{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:6px;cursor:pointer;font-size:13.5px}
.nm-list label:hover{background:var(--sheet-3)}
.nm-list input{width:16px;height:16px;flex:0 0 auto;accent-color:var(--brand)}
.nm-list em{margin-inline-start:auto;font-style:normal;font-size:11.5px;font-weight:600;color:var(--warn);white-space:nowrap}
.nm-list li.is-off span{color:var(--ink-3);text-decoration:line-through}
@media (max-width:560px){.nm-list{grid-template-columns:1fr}}

/* الاستعادة */
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:6px 0 2px}
.rgrid.single{grid-template-columns:1fr}
.rbox{padding:12px 14px;border:1px solid var(--rule);border-radius:var(--r);background:var(--sheet-2)}
.rbox-title{font-weight:700;font-size:14px}
.rbox-meta{margin:2px 0 8px;font-size:12.5px;color:var(--ink-3);overflow-wrap:anywhere}
.rbox-list{margin:0;display:grid;gap:3px}
.rbox-list div{display:flex;justify-content:space-between;gap:10px;font-size:13.5px}
.rbox-list dt{color:var(--ink-2)}
.rbox-list dd{margin:0;font-weight:700;font-variant-numeric:tabular-nums}

/* الإشعارات */
.toasts{position:fixed;bottom:18px;left:18px;z-index:300;display:flex;flex-direction:column;align-items:stretch;gap:8px;width:min(390px,calc(100vw - 36px));pointer-events:none}
body.has-modal .toasts{bottom:auto;top:10px;left:50%;transform:translateX(-50%);width:min(360px,calc(100vw - 24px))}
.toast{pointer-events:auto;display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:12px;background:#1B2438;color:#EEF1F7;box-shadow:0 18px 40px -14px rgba(0,0,0,.5);font-size:14px;line-height:1.55;animation:toastIn .22s ease}
:root[data-theme="dark"] .toast{background:#25314B;border:1px solid #36456A}
.toast.out{opacity:0;transform:translateY(6px);transition:opacity .18s,transform .18s}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.toast>.ico{width:19px;height:19px}
.toast-success>.ico{color:#6FD69C}.toast-error>.ico{color:#FF9C92}.toast-warn>.ico{color:#F6C561}.toast-info>.ico{color:#9DB4FF}
.toast-msg{flex:1;min-width:0;overflow-wrap:anywhere}
.toast-action{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:8px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.06);color:#fff;font-size:13px;font-weight:700;white-space:nowrap}
.toast-action:hover{background:rgba(255,255,255,.15)}
.toast-action .ico{width:15px;height:15px;transform:scaleX(-1)}
.toast-x{width:28px;height:28px;display:grid;place-items:center;flex:0 0 auto;border:0;border-radius:7px;background:transparent;color:rgba(255,255,255,.65)}
.toast-x:hover{background:rgba(255,255,255,.1);color:#fff}
.toast-x .ico{width:15px;height:15px}

/* ============ شاشة الترحيب ============ */
.welcome-back{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(13,19,32,.4);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);opacity:0;transition:opacity .28s ease}
.welcome-back.open{opacity:1}
.wc{width:100%;max-width:560px;max-height:calc(100vh - 40px);max-height:calc(100dvh - 40px);overflow:auto;background:var(--sheet);border:1px solid var(--rule);border-radius:22px;box-shadow:var(--shadow-lg);transform:translateY(16px) scale(.98);transition:transform .42s cubic-bezier(.2,.8,.2,1)}
.welcome-back.open .wc{transform:none}
.wc-top{position:relative;padding:40px 36px 24px;text-align:center;overflow:hidden;border-radius:22px 22px 0 0}
.wc-top::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(180deg,transparent 0 31px,var(--wc-line) 31px 32px);-webkit-mask-image:linear-gradient(180deg,#000 0,rgba(0,0,0,.5) 30%,transparent 52%);mask-image:linear-gradient(180deg,#000 0,rgba(0,0,0,.5) 30%,transparent 52%);pointer-events:none}
.wc-top>*{position:relative}
.wc-mark{width:66px;height:66px;margin:0 auto 18px;border-radius:18px;display:grid;place-items:center;background:var(--brand);color:var(--on-brand);box-shadow:0 16px 30px -16px var(--brand)}
.wc-mark .ico{width:34px;height:34px;stroke-width:1.6}
.wc h2{margin:0;font-family:var(--font-head);font-weight:600;font-size:40px;line-height:1.15;color:var(--ink)}
.wc-lead{margin:12px auto 0;max-width:430px;font-size:15px;line-height:1.9;color:var(--ink-2)}
.wc-feats{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin-top:20px}
.wc-feat{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:99px;border:1px solid var(--rule);background:var(--sheet);font-size:13px;font-weight:600;color:var(--ink-2)}
.wc-feat .ico{width:16px;height:16px;color:var(--brand)}
.wc-dev{margin:6px 28px 0;padding:18px 20px 20px;border:1px solid var(--rule);border-radius:16px;background:var(--sheet-2)}
.wc-dev-label{font-size:12px;font-weight:600;color:var(--ink-3)}
.wc-dev-name{margin-top:1px;font-family:var(--font-head);font-weight:600;font-size:28px;line-height:1.2;color:var(--ink)}
.wc-dev-note{margin-top:12px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.wc-contacts{display:grid;gap:8px;margin-top:6px}
.wc-contact{display:flex;align-items:center;gap:10px;min-width:0;height:44px;padding:0 12px 0 6px;border-radius:11px;border:1px solid var(--rule);background:var(--sheet)}
.wc-contact>.ico{width:18px;height:18px;color:var(--brand)}
.wc-contact a{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right;font-size:15px;font-weight:600;color:var(--ink);text-decoration:none;font-variant-numeric:tabular-nums}
.wc-contact a:hover{color:var(--brand);text-decoration:underline;text-underline-offset:3px}
.wc-copy{width:32px;height:32px;flex:0 0 auto;display:grid;place-items:center;border:0;border-radius:8px;background:transparent;color:var(--ink-3)}
.wc-copy:hover{background:var(--sheet-3);color:var(--ink)}
.wc-copy .ico{width:16px;height:16px}
.wc-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:20px 28px 26px}
.wc-check{display:inline-flex;align-items:center;gap:9px;font-size:13.5px;color:var(--ink-2);cursor:pointer;user-select:none}

/* ============ الشاشات الصغيرة ============ */
@media (max-width:1180px){.sys-status .ss-sub{display:none}}

  .sys-status .ss-sub{display:flex}
}

}

  .p-foot{display:flex;justify-content:space-between;gap:16pt;margin-top:26pt;font-size:10pt;color:#222;break-inside:avoid}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

<script>
(() => {
'use strict';
/* ============================================================
   دفتر الدرجات — نظام محلي لرصد تكاليف الطلاب ومشاركاتهم واختباراتهم
   ملف واحد يعمل دون إنترنت؛ البيانات في localStorage
   ============================================================ */

/* ---------- الثوابت ---------- */
const APP_ID = 'daftar-takaleef';
const DATA_VERSION = 1;
const STORAGE_KEY = 'daftar:data:v1';
const PREFS_KEY = 'daftar:prefs:v1';
const TXT = '\u2066.txt\u2069';
const LTR = s => '\u2066' + s + '\u2069';
const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };

const TASK_TYPES = [
  { key: 'research', label: 'بحث', tone: 'indigo', group: 'work' },
  { key: 'workshop', label: 'ورشة عمل', tone: 'teal', group: 'work' },
  { key: 'participation', label: 'مشاركة بالقاعة', tone: 'sky', group: 'work' },
  { key: 'discussion', label: 'مناقشة', tone: 'violet', group: 'work' },
  { key: 'quiz', label: 'اختبار قصير', tone: 'orange', group: 'work' },
  { key: 'custom', label: 'نوع مخصص', tone: 'slate', group: 'work' },
  { key: 'midterm', label: 'اختبار فصلي', tone: 'plum', group: 'midterm' },
  { key: 'final', label: 'اختبار نهائي', tone: 'navy', group: 'final' }
];
/* مجموعات أعمدة الرصد بالترتيب الذي تظهر به */
const GROUPS = [
  { key: 'work', label: 'أعمال الفصل والمشاركات', short: 'الأعمال', sub: 'مجموع الأعمال' },
  { key: 'midterm', label: 'الاختبار الفصلي', short: 'الفصلي', sub: 'مجموع الفصلي' },
  { key: 'final', label: 'الاختبار النهائي', short: 'النهائي', sub: 'مجموع النهائي' }
];
const TYPE_MAP = {};
TASK_TYPES.forEach(t => { TYPE_MAP[t.key] = t; });

const STATUS = {
  complete: { label: 'مكتمل', icon: 'check', long: 'أنجز جميع التكاليف' },
  partial: { label: 'ناقص', icon: 'clock', long: 'بقي عليه تكليف أو أكثر' },
  zero: { label: 'متعثر', icon: 'x', long: 'لم يُرصد له أي تكليف أو مجموعه صفر' },
  none: { label: 'بلا تكاليف', icon: 'minus', long: 'لا توجد تكاليف محتسبة في مؤشر الإنجاز بعد' }
};

/* صيغ العدد: [واحد، اثنان، 3-10، 11-99، غير ذلك] */
const FORMS = {
  student: ['طالب واحد', 'طالبان', 'طلاب', 'طالباً', 'طالب'],
  task: ['تكليف واحد', 'تكليفان', 'تكاليف', 'تكليفاً', 'تكليف'],
  grade: ['درجة واحدة', 'درجتان', 'درجات', 'درجةً', 'درجة'],
  note: ['ملاحظة واحدة', 'ملاحظتان', 'ملاحظات', 'ملاحظةً', 'ملاحظة'],
  course: ['مادة واحدة', 'مادتان', 'مواد', 'مادةً', 'مادة'],
  day: ['يوم واحد', 'يومان', 'أيام', 'يوماً', 'يوم']
};
function arCount(n, key) {
  const f = FORMS[key];
  if (n === 1) return f[0];
  if (n === 2) return f[1];
  const r = n % 100;
  if (r >= 3 && r <= 10) return n + ' ' + f[2];
  if (r >= 11 && r <= 99) return n + ' ' + f[3];
  return n + ' ' + f[4];
}

/* ---------- أدوات عامة ---------- */
function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, c => ESC[c]); }
function $(s, r) { return (r || document).querySelector(s); }
function icon(name, cls) { return '<svg class="ico' + (cls ? ' ' + cls : '') + '" aria-hidden="true" focusable="false"><use href="#i-' + name + '"></use></svg>'; }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 9); }
function round2(n) { return Math.round(n * 100) / 100; }
function fmt(n) { return (typeof n === 'number' && isFinite(n)) ? String(round2(n)) : ''; }
function pad2(n) { return String(n).padStart(2, '0'); }
function nowIso() { return new Date().toISOString(); }
function isIso(v) { return typeof v === 'string' && v !== '' && !isNaN(new Date(v).getTime()); }
function truncate(s, n) { s = String(s); return s.length > n ? s.slice(0, n - 1) + '…' : s; }
function cssEsc(s) { return (window.CSS && CSS.escape) ? CSS.escape(s) : String(s).replace(/["\\]/g, '\\$&'); }

/* تحويل الأرقام العربية الهندية والفاصلة العشرية العربية */
function toLatinDigits(s) {
  return String(s)
    .replace(/[\u0660-\u0669]/g, d => String(d.charCodeAt(0) - 0x0660))
    .replace(/[\u06F0-\u06F9]/g, d => String(d.charCodeAt(0) - 0x06F0));
}
function parseNum(raw) {
  const s = toLatinDigits(raw == null ? '' : raw).replace(/[\u066B\u060C,]/g, '.').replace(/\s+/g, '');
  if (s === '') return { empty: true };
  if (!/^(\d+\.?\d*|\.\d+)$/.test(s)) return { error: true };
  const n = round2(parseFloat(s));
  if (!isFinite(n)) return { error: true };
  return { value: n };
}
function toNumber(v) {
  if (typeof v === 'number') return isFinite(v) ? v : NaN;
  if (typeof v === 'string') { const r = parseNum(v); return r.value !== undefined ? r.value : NaN; }
  return NaN;
}

/* توحيد النص العربي للبحث ومقارنة التكرار */
function normAr(s) {
  return String(s == null ? '' : s)
    .replace(/[\u064B-\u065F\u0670\u06D6-\u06ED]/g, '')
    .replace(/\u0640/g, '')
    .replace(/[\u0622\u0623\u0625\u0671]/g, '\u0627')
    .replace(/\u0649/g, '\u064A')
    .replace(/\u0629/g, '\u0647')
    .replace(/\u0624/g, '\u0648')
    .replace(/\u0626/g, '\u064A')
    .toLowerCase()
    .replace(/\s+/g, ' ')
    .trim();
}
function nameKey(s) { return normAr(s).replace(/ /g, ''); }
function cleanText(s) {
  return String(s == null ? '' : s)
    .replace(/[\u200B\u200E\u200F\u202A-\u202E\u2066-\u2069\uFEFF]/g, '')
    .replace(/\s+/g, ' ')
    .trim();
}

/* التواريخ */
function fmtDate(d) { return d.getFullYear() + '/' + pad2(d.getMonth() + 1) + '/' + pad2(d.getDate()); }
function fmtTime(d) { const h = d.getHours(); return (h % 12 || 12) + ':' + pad2(d.getMinutes()) + ' ' + (h < 12 ? 'ص' : 'م'); }
function fmtDateTime(iso) { const d = new Date(iso); return isNaN(d.getTime()) ? '' : fmtDate(d) + '، ' + fmtTime(d); }
function fmtHijri(d) {
  try {
    const f = new Intl.DateTimeFormat('en-US-u-ca-islamic-umalqura', { year: 'numeric', month: '2-digit', day: '2-digit' });
    if (f.resolvedOptions().calendar !== 'islamic-umalqura') return '';
    const p = {};
    f.formatToParts(d).forEach(x => { p[x.type] = x.value; });
    const y = String(p.year || '').replace(/\D/g, '');
    if (!y || !p.month || !p.day) return '';
    return y + '/' + p.month + '/' + p.day + 'هـ';
  } catch (e) { return ''; }
}
function daysBetween(a, b) {
  const d1 = new Date(a.getFullYear(), a.getMonth(), a.getDate());
  const d2 = new Date(b.getFullYear(), b.getMonth(), b.getDate());
  return Math.round((d2 - d1) / 86400000);
}
function relDay(iso) {
  const d = new Date(iso);
  if (isNaN(d.getTime())) return '';
  const days = daysBetween(d, new Date());
  if (days <= 0) return 'اليوم ' + fmtTime(d);
  if (days === 1) return 'أمس ' + fmtTime(d);
  if (days === 2) return 'منذ يومين';
  return 'منذ ' + arCount(days, 'day');
}

/* ---------- الحالة والتخزين ---------- */
let storageOk = true;
let saveError = '';
let lastSavedAt = null;
let revision = 0;
let undo = null;
const ui = { search: '', filter: 'all' };
let prefs = loadPrefs();
let state = loadState();

function emptyState() { return { version: DATA_VERSION, activeCourseId: null, courses: [] }; }

function loadPrefs() {
  const d = { theme: null, lastBackupAt: null, hideWelcome: false };
  try {
    const raw = localStorage.getItem(PREFS_KEY);
    if (!raw) return d;
    const p = JSON.parse(raw) || {};
    return {
      theme: (p.theme === 'dark' || p.theme === 'light') ? p.theme : null,
      lastBackupAt: isIso(p.lastBackupAt) ? p.lastBackupAt : null,
      hideWelcome: p.hideWelcome === true
    };
  } catch (e) { return d; }
}
function savePrefs() { try { localStorage.setItem(PREFS_KEY, JSON.stringify(prefs)); } catch (e) { /* تجاهل */ } }

function loadState() {
  let raw = null;
  try { raw = localStorage.getItem(STORAGE_KEY); }
  catch (e) { storageOk = false; return emptyState(); }
  if (!raw) return emptyState();
  try {
    const res = sanitizeData(JSON.parse(raw));
    if (res.ok) return res.data;
  } catch (e) { /* بيانات تالفة */ }
  try { localStorage.setItem(STORAGE_KEY + ':corrupt:' + Date.now(), raw); } catch (e) { /* تجاهل */ }
  setTimeout(() => toast('تعذّرت قراءة البيانات المحفوظة لأنها تالفة. احتُفظ بنسخة منها داخل المتصفح، ويمكنك استعادة آخر نسخة احتياطية لديك.', { type: 'error', duration: 12000 }), 300);
  return emptyState();
}

/* الحفظ اللحظي؛ silent لا يُعدّ تعديلاً على البيانات (مثل تغيير التبويب) */
function saveState(opts) {
  if (!(opts && opts.silent)) {
    revision++;
    if (undo && undo.rev !== revision) clearUndo();
  }
  if (!storageOk) { updateSaveStatus(); return false; }
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    lastSavedAt = new Date();
    saveError = '';
  } catch (e) {
    saveError = (e && (e.name === 'QuotaExceededError' || e.code === 22)) ? 'امتلأت مساحة التخزين في المتصفح' : 'تعذّر الحفظ في المتصفح';
  }
  updateSaveStatus();
  return !saveError;
}

/* ---------- التحقق من البيانات وتنظيفها (للتحميل والاستعادة) ---------- */
function sanitizeData(input) {
  if (!input || typeof input !== 'object') return { ok: false, error: 'محتوى الملف ليس بيانات صالحة.' };
  let src = input;
  if (input.data && typeof input.data === 'object' && Array.isArray(input.data.courses)) src = input.data;
  if (!Array.isArray(src.courses)) return { ok: false, error: 'لم يُعثر داخل الملف على قائمة المواد، فهو ليس نسخة احتياطية من هذا البرنامج.' };
  const str = (v, max) => cleanText(typeof v === 'string' ? v : (v == null ? '' : String(v))).slice(0, max);
  const courseIds = new Set();
  const courses = [];
  src.courses.forEach(rc => {
    if (!rc || typeof rc !== 'object') return;
    let id = typeof rc.id === 'string' && rc.id.trim() ? rc.id.trim() : uid();
    if (courseIds.has(id)) id = uid();
    courseIds.add(id);
    const tasks = [];
    const taskIds = new Set();
    const maxById = Object.create(null);
    (Array.isArray(rc.tasks) ? rc.tasks : []).forEach(rt => {
      if (!rt || typeof rt !== 'object') return;
      let tid = typeof rt.id === 'string' && rt.id.trim() ? rt.id.trim() : uid();
      if (taskIds.has(tid)) tid = uid();
      taskIds.add(tid);
      let max = toNumber(rt.maxGrade);
      if (!(max > 0)) max = 10;
      max = Math.min(round2(max), 1000);
      const known = typeof rt.type === 'string' && Object.prototype.hasOwnProperty.call(TYPE_MAP, rt.type);
      const type = known ? rt.type : 'custom';
      let customType = '';
      if (type === 'custom') customType = str(rt.customType, 40) || (typeof rt.type === 'string' && !known ? str(rt.type, 40) : '');
      tasks.push({
        id: tid, title: str(rt.title, 120) || 'تكليف بدون عنوان', type, customType,
        maxGrade: max, counted: rt.counted !== false, createdAt: isIso(rt.createdAt) ? rt.createdAt : nowIso()
      });
      maxById[tid] = max;
    });
    const students = [];
    const studentIds = new Set();
    (Array.isArray(rc.students) ? rc.students : []).forEach(rs => {
      if (!rs || typeof rs !== 'object') return;
      const name = str(rs.name, 150);
      if (!name) return;
      let sid = typeof rs.id === 'string' && rs.id.trim() ? rs.id.trim() : uid();
      if (studentIds.has(sid)) sid = uid();
      studentIds.add(sid);
      const grades = {};
      if (rs.grades && typeof rs.grades === 'object') {
        Object.keys(rs.grades).forEach(tid => {
          if (!(tid in maxById)) return;
          const g = toNumber(rs.grades[tid]);
          if (isFinite(g) && g >= 0) grades[tid] = Math.min(round2(g), maxById[tid]);
        });
      }
      const notes = [];
      (Array.isArray(rs.notes) ? rs.notes : []).forEach(rn => {
        if (!rn) return;
        const text = typeof rn === 'string' ? rn : rn.text;
        const t = typeof text === 'string' ? text.replace(/\r\n?/g, '\n').trim().slice(0, 5000) : '';
        if (!t) return;
        notes.push({
          id: (rn && typeof rn.id === 'string' && rn.id) ? rn.id : uid(), text: t,
          createdAt: isIso(rn.createdAt) ? rn.createdAt : nowIso(),
          updatedAt: isIso(rn.updatedAt) ? rn.updatedAt : null
        });
      });
      students.push({ id: sid, name, grades, notes, createdAt: isIso(rs.createdAt) ? rs.createdAt : nowIso() });
    });
    let total = toNumber(rc.totalGrade);
    total = (isFinite(total) && total > 0) ? Math.min(round2(total), 100000) : null;
    courses.push({
      id, name: str(rc.name, 120) || 'مادة بدون اسم', code: str(rc.code, 40), section: str(rc.section, 40),
      totalGrade: total, createdAt: isIso(rc.createdAt) ? rc.createdAt : nowIso(), tasks, students
    });
  });
  let active = typeof src.activeCourseId === 'string' ? src.activeCourseId : null;
  if (!courses.some(c => c.id === active)) active = courses.length ? courses[0].id : null;
  return { ok: true, data: { version: DATA_VERSION, activeCourseId: active, courses } };
}

/* ---------- الحسابات ---------- */
function currentCourse() { return state.courses.find(c => c.id === state.activeCourseId) || null; }
function courseById(id) { return state.courses.find(c => c.id === id) || null; }
function findStudent(course, sid) { return course ? (course.students.find(s => s.id === sid) || null) : null; }
function typeLabel(t) { return t.type === 'custom' ? (t.customType || 'نوع مخصص') : (TYPE_MAP[t.type] ? TYPE_MAP[t.type].label : 'تكليف'); }
function typeTone(t) { return TYPE_MAP[t.type] ? TYPE_MAP[t.type].tone : 'slate'; }
function tasksTotal(course) { return round2(course.tasks.reduce((a, t) => a + t.maxGrade, 0)); }
function taskGroup(t) { return TYPE_MAP[t.type] ? TYPE_MAP[t.type].group : 'work'; }
/* الاختبارات لا تدخل في مؤشر إنجاز التكاليف */
function isCounted(t) { return taskGroup(t) === 'work' && t.counted !== false; }
function isWorkOff(t) { return taskGroup(t) === 'work' && t.counted === false; }
function courseGroups(course) {
  return GROUPS.map(g => {
    const tasks = course.tasks.filter(t => taskGroup(t) === g.key);
    return { key: g.key, label: g.label, short: g.short, sub: g.sub, tasks, max: round2(tasks.reduce((a, t) => a + t.maxGrade, 0)) };
  }).filter(g => g.tasks.length);
}

/* حالة الطالب: مكتمل / ناقص / متعثر / بلا تكاليف */
function studentResult(course, s) {
  let done = 0, req = 0, total = 0;
  const groups = { work: 0, midterm: 0, final: 0 };
  course.tasks.forEach(t => {
    const counted = isCounted(t);
    if (counted) req++;
    const g = s.grades[t.id];
    if (typeof g === 'number') { total += g; groups[taskGroup(t)] += g; if (counted) done++; }
  });
  total = round2(total);
  Object.keys(groups).forEach(k => { groups[k] = round2(groups[k]); });
  let status;
  if (req === 0) status = 'none';
  else if (done === 0 || groups.work === 0) status = 'zero';
  else if (done >= req) status = 'complete';
  else status = 'partial';
  return { done, req, total, status, groups };
}

function courseStats(course) {
  const r = { students: course.students.length, complete: 0, partial: 0, zero: 0, none: 0, tasksTotal: tasksTotal(course), avgTotal: 0, avgGroups: { work: 0, midterm: 0, final: 0 } };
  let sum = 0;
  const gs = { work: 0, midterm: 0, final: 0 };
  course.students.forEach(s => {
    const x = studentResult(course, s);
    r[x.status]++;
    sum += x.total;
    Object.keys(gs).forEach(k => { gs[k] += x.groups[k]; });
  });
  if (r.students) {
    r.avgTotal = round2(sum / r.students);
    Object.keys(gs).forEach(k => { r.avgGroups[k] = round2(gs[k] / r.students); });
  }
  return r;
}

function taskStats(course, t) {
  let count = 0, sum = 0;
  course.students.forEach(s => { const g = s.grades[t.id]; if (typeof g === 'number') { count++; sum += g; } });
  return { count, avg: count ? round2(sum / count) : null };
}
function courseCounts(c) {
  let grades = 0, notes = 0;
  c.students.forEach(s => { grades += Object.keys(s.grades).length; notes += s.notes.length; });
  return { students: c.students.length, tasks: c.tasks.length, grades, notes };
}
function countsOf(data) {
  const r = { courses: data.courses.length, students: 0, tasks: 0, grades: 0, notes: 0 };
  data.courses.forEach(c => { const x = courseCounts(c); r.students += x.students; r.tasks += x.tasks; r.grades += x.grades; r.notes += x.notes; });
  return r;
}

      '<button type="button" class="btn btn-line" data-act="import-names" title="استيراد أسماء الطلاب من ملف Excel (&lrm;.xlsx&lrm; أو &lrm;.xls&lrm;)">' + icon('file-up') + '<span>استيراد من Excel</span></button>' +
      '<button type="button" class="btn btn-line" data-act="sort" title="ترتيب الأسماء أبجدياً، وانقر مرة أخرى لعكس الترتيب">' + icon('sort') + '<span>ترتيب أبجدي</span></button>' +
      '<button type="button" class="btn btn-line" data-act="add-task" title="إضافة تكليف أو اختبار للمادة">' + icon('plus') + '<span>تكليف أو اختبار</span></button>' +
    '</div></div>';
}
function filterChipHtml() {
  if (ui.filter === 'all') return '';
  return '<button type="button" class="filter-chip st-' + ui.filter + '" data-act="clear-filter" title="إلغاء التصفية">' + icon('filter') + '<span>المعروض: ' + STATUS[ui.filter].label + ' فقط</span>' + icon('x') + '</button>';
}

function visibleStudents(course) {
  const tokens = normAr(ui.search).split(' ').filter(Boolean);
  return course.students.filter(s => {
    if (tokens.length) {
      const n = normAr(s.name);
      if (!tokens.every(tk => n.includes(tk))) return false;
    }
    if (ui.filter !== 'all' && studentResult(course, s).status !== ui.filter) return false;
    return true;
  });
}

function emptyStateHtml(course) {
  const noTasks = !course.tasks.length;
  return '<div class="empty"><div class="empty-ico">' + icon(noTasks ? 'list-checks' : 'users') + '</div>' +
    '<h3>' + (noTasks ? 'المادة جاهزة للإعداد' : 'لا يوجد طلاب في هذه المادة بعد') + '</h3>' +
    '<p>' + (noTasks
      ? 'حدّد التكاليف والمشاركات والاختبارات ودرجة كل منها، ثم أضف أسماء الطلاب لتظهر لك ورقة الرصد.'
      : 'أضف الطلاب واحداً واحداً، أو استورد قائمتهم من ملف Excel مباشرة؛ يتعرّف البرنامج على عمود الأسماء تلقائياً.') + '</p>' +
    '<div class="empty-actions">' +
      (noTasks ? '<button type="button" class="btn btn-primary" data-act="add-task">' + icon('plus') + '<span>إضافة تكليف أو اختبار</span></button>' : '') +
      '<button type="button" class="btn ' + (noTasks ? 'btn-line' : 'btn-primary') + '" data-act="add-student">' + icon('user-plus') + '<span>إضافة طالب</span></button>' +
      '<button type="button" class="btn btn-line" data-act="import-names">' + icon('file-up') + '<span>استيراد الأسماء من Excel</span></button>' +
    '</div></div>';
